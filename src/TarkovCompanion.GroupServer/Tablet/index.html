<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tarkov Companion — second screen</title>
<style>
  :root {
    --ground: #0b1016;
    --panel: #131b24;
    --inset: #0e151d;
    --line: #22303d;
    --text: #dce5ee;
    --quiet: #8f9ba6;
    --ochre: #c7a66b;
    --sage: #77b895;
    --alarm: #c77b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .quiet { color: var(--quiet); font-size: 13px; }
  input, button, select {
    font: inherit; color: var(--text); background: var(--inset);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  input { min-width: 0; }
  button { cursor: pointer; }
  button.primary { background: var(--ochre); color: #1b1710; border-color: var(--ochre); font-weight: 600; }
  button:active { transform: translateY(1px); }
  main { padding: 16px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); max-width: 1100px; margin: 0 auto; }
  @media (min-width: 860px) { main { grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--quiet); margin: 0 0 10px; font-weight: 600; }
  #plot { width: 100%; aspect-ratio: 1 / 1; max-height: 62vh; display: block; touch-action: manipulation; border-radius: 8px; background: var(--inset); }
  .row { border: 1px solid var(--line); background: var(--inset); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #0b1016; flex: none; }
  .meta { color: var(--quiet); font-size: 13px; }
  .stale { opacity: .55; }
  .note { color: var(--quiet); font-size: 13px; margin: 10px 0 0; }
  .bad { color: var(--alarm); }
  .good { color: var(--sage); }
  .modes { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .modes button[aria-pressed="true"] { background: var(--ochre); color: #1b1710; border-color: var(--ochre); }
  .empty { color: var(--quiet); font-size: 13px; }
  /* A mark's row has to hold a button now. Forty-four pixels because this is read on a tablet
     with a thumb, and a Remove that needs aiming is a Remove that removes the wrong one. */
  .markRow { display: flex; align-items: center; gap: 10px; }
  .markRow > div:first-child { flex: 1; min-width: 0; }
  .markRow button { flex: none; min-height: 44px; }
  .clears { display: flex; gap: 8px; margin-top: 10px; }
  .clears button { flex: 1; min-height: 44px; }
  button[disabled] { opacity: .45; cursor: default; }
  form { display: contents; }
</style>
</head>
<body>
<header>
  <h1>Tarkov Companion</h1>
  <span class="quiet" id="status">not connected</span>
  <form id="join" style="display:flex;gap:8px;flex:1;min-width:220px;justify-content:flex-end;flex-wrap:wrap">
    <input id="name" placeholder="Your name" autocomplete="off" size="10">
    <input id="key" type="password" placeholder="Group key" autocomplete="off" size="12">
    <button class="primary" type="submit">Connect</button>
  </form>
</header>

<main>
  <section>
    <h2>Where everybody is</h2>
    <div class="modes" id="maps"></div>
    <div class="modes">
      <button type="button" id="modeWaypoint" aria-pressed="true">Tap to place a waypoint</button>
      <button type="button" id="modePing" aria-pressed="false">Tap to ping</button>
    </div>
    <canvas id="plot" width="900" height="900"></canvas>
    <p class="note" id="plotNote">A schematic, not the map. Positions are world coordinates from
      everybody's own screenshots, drawn relative to each other.</p>
  </section>

  <section>
    <h2>Group</h2>
    <div id="members"><p class="empty">Nobody is sharing yet.</p></div>
    <h2 style="margin-top:16px">Marks</h2>
    <div id="marks"><p class="empty">Nothing marked.</p></div>
    <!-- Two, because they are different questions. Clearing the reached ones is tidying after
         a run; clearing all of them is starting again. Both belong to the group, which is why
         either can be pressed by anybody holding the key. -->
    <div class="clears">
      <button type="button" id="clearReached" disabled>Clear reached</button>
      <button type="button" id="clearAll" disabled>Clear all</button>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* private window */ } },
  };

  let key = store.get("key", "");
  let name = store.get("name", "");
  let mode = "waypoint";
  let room = null;
  // Which map this screen is about.
  //
  // Everything used to be drawn on one grid regardless of map, so two friends in different
  // raids were plotted against each other at coordinates that have nothing in common, and the
  // auto-framing then zoomed out to contain both. A tap then marked whichever map the first
  // member in the list happened to be on, which is not an order that means anything to the
  // person tapping.
  //
  // Null means "follow the group", which re-picks whenever the room changes. Choosing one
  // pins it, so a map does not move out from under somebody about to tap it.
  let chosenMap = null;
  // Every map's landmarks, keyed by map. Fetched once: it is 4.6 KB gzipped for all of them,
  // against 780 KB for the map catalog it is derived from, which is the difference between a
  // page a phone opens on a sofa and one it does not.
  let landmarks = {};
  let timer = null;

  $("key").value = key;
  $("name").value = name;

  // The colours the desktop map uses for group members, so a name on a tablet and a dot on a
  // monitor are the same person without anybody having to work it out.
  const COLOURS = ["#77B895", "#C7A66B", "#7FA9C7", "#C78FB4", "#B4C77F", "#C79A7F", "#9B8FC7", "#7FC7C0"];
  const colourFor = (who) => {
    let hash = 0;
    for (const ch of who) hash = (hash * 31 + ch.charCodeAt(0)) | 0;
    return COLOURS[Math.abs(hash) % COLOURS.length];
  };

  const setStatus = (text, cls) => {
    const el = $("status");
    el.textContent = text;
    el.className = "quiet " + (cls || "");
  };

  async function call(path, options) {
    const response = await fetch(path, {
      ...options,
      headers: { "X-Group-Key": key, "Content-Type": "application/json", ...(options?.headers || {}) },
    });
    if (response.status === 401) throw new Error("That key was refused");
    if (!response.ok) throw new Error("The server answered " + response.status);
    // Not every answer has a body. Removing a mark is answered 200 with nothing in it, and
    // response.json() on an empty body throws, which would report a removal that worked as a
    // failure and leave the button disabled over it.
    const body = await response.text();
    return body ? JSON.parse(body) : null;
  }

  // No key needed, and fetched at startup so it is already here when the first position
  // arrives. Which map to draw is not knowable until somebody is on one, so this does not put
  // anything on screen by itself -- it means the map appears complete the first time it appears
  // at all, rather than filling in a second later.
  //
  // A failure here costs the landmarks and nothing else. The plot drew none of this until now
  // and is no worse without them; a page that would not load because this fetch failed would be.
  async function loadLandmarks() {
    try {
      const response = await fetch("/landmarks");
      if (response.ok) {
        landmarks = await response.json();
        draw();
      }
    } catch {
      // Left empty, and the plot carries on.
    }
  }

  async function refresh() {
    if (!key) return;
    try {
      room = await call("/state");
      setStatus(describe(room), "good");
      render();
    } catch (error) {
      setStatus(error.message, "bad");
    }
  }

  const describe = (state) => {
    const n = state.members.length;
    return n === 0 ? "connected · nobody is sharing" : n === 1 ? "connected · 1 member" : `connected · ${n} members`;
  };

  const age = (seconds) => {
    if (seconds == null) return "at an unknown time";
    if (seconds < 60) return `${Math.max(0, Math.round(seconds))}s ago`;
    return `${Math.round(seconds / 60)}m ago`;
  };

  /// Which maps the room is spread across, most-populated first.
  function mapsInUse() {
    const counts = new Map();
    for (const member of room?.members ?? []) {
      if (member.mapId) {
        counts.set(member.mapId, (counts.get(member.mapId) ?? 0) + 1);
      }
    }

    return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  }

  // The map being shown: the chosen one while it still has somebody on it, otherwise wherever
  // most of the group is.
  //
  // The chosen one is dropped when its last member leaves rather than kept, because a map
  // nobody is on has nothing to draw and no sensible place to mark.
  function activeMap() {
    const inUse = mapsInUse();
    if (chosenMap && inUse.some(([id]) => id === chosenMap)) {
      return chosenMap;
    }

    chosenMap = null;
    return inUse.length > 0 ? inUse[0][0] : null;
  }

  // One button per map, and none at all when there is only one — a chooser with a single
  // option is a control that asks a question with one answer.
  function renderMaps() {
    const holder = $("maps");
    holder.replaceChildren();
    const inUse = mapsInUse();
    if (inUse.length < 2) {
      return;
    }

    const active = activeMap();
    for (const [mapId, count] of inUse) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = count === 1 ? `${mapId} · 1` : `${mapId} · ${count}`;
      button.setAttribute("aria-pressed", mapId === active ? "true" : "false");
      button.addEventListener("click", () => {
        chosenMap = mapId;
        render();
      });
      holder.appendChild(button);
    }
  }

  // The height to mark at, taken from whoever on this map is nearest the tap.
  //
  // Zero is a claim, not an absence: GroupWaypointReach measures in three dimensions with a
  // 50 m radius, so on a map whose ground is not at zero every mark spent part of that radius
  // on a height error before the horizontal distance was counted, and waypoints ticked
  // themselves off late or never.
  function heightNear(mapId, x, z) {
    let best = null;
    let nearest = Infinity;
    for (const member of room?.members ?? []) {
      if (member.mapId !== mapId || member.x == null || member.z == null || member.y == null) {
        continue;
      }

      const distance = Math.hypot(member.x - x, member.z - z);
      if (distance < nearest) {
        nearest = distance;
        best = member.y;
      }
    }

    return best;
  }

  function render() {
    const members = room?.members ?? [];
    const holder = $("members");
    holder.innerHTML = "";
    if (members.length === 0) {
      holder.innerHTML = '<p class="empty">Nobody is sharing yet.</p>';
    }
    const onScreen = activeMap();
    for (const member of members) {
      const row = document.createElement("div");
      // Somebody on another map is dimmed the same way somebody stale is, because in both
      // cases their marker is not on the plot and the row is the only place that says so.
      const elsewhere = onScreen !== null && member.mapId !== onScreen;
      row.className = "row" + ((member.positionAge ?? 0) > 300 || elsewhere ? " stale" : "");
      const where = member.mapId
        ? `${member.mapId} · ${member.raidState}${member.side ? " · " + member.side : ""}`
        : member.raidState;
      const at = member.x == null || member.z == null
        ? "No screenshot position shared."
        : `${Math.round(member.x)}, ${Math.round(member.z)} · from a screenshot ${age(member.positionAge)}`;
      const extra = [...(member.loadout ?? []), ...(member.quests ?? [])].join(" · ");
      row.innerHTML =
        `<div class="name"><span class="dot" style="background:${colourFor(member.name)}"></span>` +
        `<span></span></div><div class="meta"></div><div class="meta"></div>` +
        (extra ? '<div class="meta"></div>' : "");
      const cells = row.querySelectorAll("span:last-child, .meta");
      cells[0].textContent = member.name;
      cells[1].textContent = where;
      cells[2].textContent = at;
      if (extra) cells[3].textContent = extra;
      holder.appendChild(row);
    }

    // The map on screen, like everything else here. Listing every map's marks under buttons
    // that clear one map's would be a list that disagrees with the buttons beneath it.
    const shown = activeMap();
    const marks = [
      ...(room?.waypoints ?? []).map((w) => ({ ...w, kind: "Waypoint" })),
      ...(room?.pings ?? []).map((p) => ({ ...p, kind: "Ping" })),
    ].filter((mark) => mark.mapId === shown);
    const markHolder = $("marks");
    markHolder.innerHTML = "";
    if (marks.length === 0) {
      markHolder.innerHTML = shown
        ? '<p class="empty">Nothing marked on this map.</p>'
        : '<p class="empty">Nothing marked.</p>';
    }
    for (const mark of marks) {
      const row = document.createElement("div");
      row.className = "row markRow";
      row.innerHTML = '<div><div class="name"><span></span></div><div class="meta"></div></div>';
      const [title, meta] = [row.querySelector(".name span"), row.querySelector(".meta")];
      title.textContent = `${mark.kind}${mark.label ? " · " + mark.label : ""}`;
      meta.textContent = `by ${mark.by} · ${Math.round(mark.x)}, ${Math.round(mark.z)}` +
        (mark.completedBy ? ` · reached by ${mark.completedBy}` : "");
      // Waypoints only. A ping is gone in forty-five seconds whatever anybody does, so the
      // server has no endpoint for removing one and a button here would be a button that lies.
      if (mark.kind === "Waypoint") {
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => removeMark(mark.id, remove));
        row.appendChild(remove);
      }
      markHolder.appendChild(row);
    }

    renderMaps();

    // Scoped to the map on screen, so the buttons describe what pressing them would do.
    const mapId = activeMap();
    const waypoints = (room?.waypoints ?? []).filter((w) => w.mapId === mapId);
    $("clearAll").disabled = waypoints.length === 0;
    $("clearReached").disabled = !waypoints.some((w) => w.completedBy);

    draw();
  }

  // Removing a mark, which the server has served since the marks were written and no client
  // has ever asked for. Nothing is taken off this screen directly: the refresh below brings
  // back a room without it, which is the same single path that drew it, so a tablet never
  // shows a plan the group does not have.
  //
  // The button is disabled while the request is in flight rather than after it, because a
  // second tap on a tablet is easy and the second one would be a 404 on an id that is gone.
  async function removeMark(id, button) {
    if (!key || !id) return;
    button.disabled = true;
    try {
      await call(`/waypoints/${id}`, { method: "DELETE" });
      await refresh();
    } catch (error) {
      button.disabled = false;
      setStatus(error.message, "bad");
    }
  }

  // Scoped to the map the group is actually on, so tidying after a Customs raid does not take
  // the plan somebody made for Lighthouse with it. With nobody on a map there is no scope to
  // apply and the buttons stay out of it rather than clearing everything everywhere.
  async function clearMarks(reachedOnly) {
    const mapId = activeMap();
    if (!key) return;
    if (!mapId) {
      setStatus("Nobody is on a map yet, so there is nothing to clear", "bad");
      return;
    }

    const query = new URLSearchParams({ mapId });
    if (reachedOnly) query.set("reachedOnly", "true");
    try {
      const cleared = await call(`/waypoints?${query}`, { method: "DELETE" });
      // After the refresh, not before: refreshing writes the room's own description into the
      // status line and would wipe this out on its way past.
      await refresh();
      setStatus(cleared === 1 ? "Cleared 1 mark" : `Cleared ${cleared ?? 0} marks`, "good");
    } catch (error) {
      setStatus(error.message, "bad");
    }
  }

  $("clearReached").addEventListener("click", () => clearMarks(true));
  $("clearAll").addEventListener("click", () => clearMarks(false));

  // The plot. Deliberately not the map: this has no artwork and no projection, so it cannot
  // pretend to be one. What it does have is everybody's world coordinates, which is enough to
  // see who is where relative to everybody else and enough to point at a spot and say "there".
  const canvas = $("plot");
  const context = canvas.getContext("2d");
  let frame = null;

  // Only what is on the map being shown.
  //
  // This took everything with an x and a z regardless of map, so the schematic was two raids
  // drawn on top of each other and the framing had to zoom out far enough to hold both.
  // The landmarks of the map on screen, drawn quiet and behind the people.
  //
  // A lock has no name worth writing -- the catalog calls all thirty-six of Customs' "door" --
  // so it is a dot and nothing else. Only extracts carry a name the group would recognise, and
  // a transit is named for where it goes, which is the one thing the catalog does say about it.
  function landmarkPoints(mapId) {
    return (landmarks[mapId] ?? []).map((mark) => ({
      x: mark.x,
      z: mark.z,
      colour: mark.k === "l" ? "#3c4c5a" : "#55707f",
      label: mark.n ?? "",
      r: mark.k === "l" ? 2 : 3,
      quiet: true,
    }));
  }

  function points() {
    const mapId = activeMap();
    if (!mapId) {
      return [];
    }

    const found = landmarkPoints(mapId);
    for (const member of room?.members ?? []) {
      if (member.mapId === mapId && member.x != null && member.z != null) {
        found.push({ x: member.x, z: member.z, colour: colourFor(member.name), label: member.name, r: 7 });
      }
    }
    for (const w of room?.waypoints ?? []) {
      if (w.mapId === mapId) {
        found.push({ x: w.x, z: w.z, colour: w.completedBy ? "#4d5f55" : "#c7a66b", label: w.label || "waypoint", r: 5 });
      }
    }
    for (const p of room?.pings ?? []) {
      if (p.mapId === mapId) {
        found.push({ x: p.x, z: p.z, colour: "#c77b6b", label: p.label || "ping", r: 5 });
      }
    }
    return found;
  }

  function draw() {
    const size = canvas.width;
    context.clearRect(0, 0, size, size);
    const all = points();
    if (all.length === 0) {
      frame = null;
      context.fillStyle = "#8f9ba6";
      context.font = "16px system-ui, sans-serif";
      context.textAlign = "center";
      context.fillText("No positions shared yet.", size / 2, size / 2);
      return;
    }

    // Framed over everything, landmarks included, which is what steadies it.
    //
    // Fitting to the people alone made this restless: the frame moved every time anybody took
    // a screenshot, so the whole schematic slid under a finger about to tap it. Landmarks do
    // not move and they span the map, so they dominate the extent and it holds still while
    // people move across it -- the way round a map is supposed to work. Including the people
    // in the same union is what keeps somebody outside the landmarks from being framed off the
    // edge, which is the failure the previous behaviour could never have.
    const xs = all.map((p) => p.x);
    const zs = all.map((p) => p.z);
    const span = Math.max(120, Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs)) * 1.25;
    const cx = (Math.max(...xs) + Math.min(...xs)) / 2;
    const cz = (Math.max(...zs) + Math.min(...zs)) / 2;
    frame = { cx, cz, span, size };

    context.strokeStyle = "#1b2732";
    context.lineWidth = 1;
    for (let i = 1; i < 6; i++) {
      const at = (size / 6) * i;
      context.beginPath(); context.moveTo(at, 0); context.lineTo(at, size); context.stroke();
      context.beginPath(); context.moveTo(0, at); context.lineTo(size, at); context.stroke();
    }

    // North is negative Z, the same convention the desktop map and its bearings use.
    context.fillStyle = "#8f9ba6";
    context.font = "13px system-ui, sans-serif";
    context.textAlign = "center";
    context.fillText("N", size / 2, 18);

    // Landmarks first so people are drawn on top of them, and quieter in every way that is
    // available: smaller, dimmer, no outline, smaller type. A landmark that competes with a
    // squadmate for attention has made the screen worse, not better.
    for (const point of [...all].sort((a, b) => (a.quiet ? 0 : 1) - (b.quiet ? 0 : 1))) {
      const [px, py] = project(point.x, point.z);
      context.beginPath();
      context.arc(px, py, point.r, 0, Math.PI * 2);
      context.fillStyle = point.colour;
      context.fill();
      if (!point.quiet) {
        context.lineWidth = 2;
        context.strokeStyle = "#0b1016";
        context.stroke();
      }

      if (!point.label) {
        continue;
      }

      context.fillStyle = point.quiet ? "#6d7e8b" : "#dce5ee";
      context.font = point.quiet ? "11px system-ui, sans-serif" : "13px system-ui, sans-serif";
      context.textAlign = "left";
      context.fillText(point.label, px + point.r + 5, py + 4);
    }
  }

  const project = (x, z) => [
    ((x - frame.cx) / frame.span + 0.5) * frame.size,
    ((z - frame.cz) / frame.span + 0.5) * frame.size,
  ];

  const unproject = (px, py) => [
    (px / frame.size - 0.5) * frame.span + frame.cx,
    (py / frame.size - 0.5) * frame.span + frame.cz,
  ];

  canvas.addEventListener("click", async (event) => {
    if (!frame || !key) return;
    // The map this screen is showing, which is the one the tap was aimed at.
    const mapId = activeMap();
    if (!mapId) {
      setStatus("Nobody is on a map yet, so there is nowhere to mark", "bad");
      return;
    }

    const box = canvas.getBoundingClientRect();
    const px = ((event.clientX - box.left) / box.width) * canvas.width;
    const py = ((event.clientY - box.top) / box.height) * canvas.height;
    const [x, z] = unproject(px, py);
    try {
      await call(mode === "ping" ? "/pings" : "/waypoints", {
        method: "POST",
        body: JSON.stringify({
          by: name || "tablet",
          mapId,
          x,
          // Whoever is nearest, or zero when nobody on this map has published a height —
          // which is what an older client does, and is the same answer as before for them.
          y: heightNear(mapId, x, z) ?? 0,
          z,
          label: null,
        }),
      });
      await refresh();
    } catch (error) {
      setStatus(error.message, "bad");
    }
  });

  const setMode = (next) => {
    mode = next;
    $("modeWaypoint").setAttribute("aria-pressed", String(next === "waypoint"));
    $("modePing").setAttribute("aria-pressed", String(next === "ping"));
  };
  $("modeWaypoint").addEventListener("click", () => setMode("waypoint"));
  $("modePing").addEventListener("click", () => setMode("ping"));

  $("join").addEventListener("submit", (event) => {
    event.preventDefault();
    key = $("key").value.trim();
    name = $("name").value.trim();
    store.set("key", key);
    store.set("name", name);
    if (key.length < 8) {
      setStatus("A group key is at least eight characters", "bad");
      return;
    }

    start();
  });

  function start() {
    loadLandmarks();
    if (timer) clearInterval(timer);
    refresh();
    // Five seconds, the same rate the desktop client exchanges at. Faster would tell a tablet
    // nothing the desktop does not already know and would run a battery down for it.
    timer = setInterval(refresh, 5000);
  }

  // A screen left on the side of a desk stops being told anything while it is asleep; asking
  // once on waking is the difference between a current picture and a five-minute-old one.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refresh();
  });

  if (key.length >= 8) start();
  else setStatus("enter the group key", "");
})();
</script>
</body>
</html>
