name: Windows verification

# Behavioral verification of the packaged Windows build on a GitHub-hosted
# Windows runner. The maintainer's workstation must never build or run this
# project, and the remote development container is Linux, so a hosted Windows
# runner is the only sanctioned place to prove that the shipped package
# actually starts and works.
#
# Escape from Tarkov is not installed on the runner and is not required. Nothing
# here reads game memory, sends input to another process, or inspects network
# traffic.
#
# TarkovCompanion.exe is a WinExe. PowerShell does not wait for GUI-subsystem
# processes, so every headless invocation below goes through Start-Process
# -Wait -PassThru and reads ExitCode from the returned process.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Branch work is verified before it reaches the trunk, not after. The publishing steps
  # below are gated on the ref, so a pull request gets the whole gauntlet - build, test,
  # launch, photograph every page - and publishes nothing.
  pull_request:
    branches:
      - main

# One publish at a time per ref. Two main runs started four seconds apart once and
# finished out of order, leaving the rolling `dev` release on the older build. An
# older run is cancelled rather than queued: it is about to be superseded, and since
# the publish no longer deletes anything and writes the feed files last, a cancelled
# one leaves the previous build whole.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Runs alongside the Windows job so a compile error or a failing test surfaces without
  # waiting on packaging, and so the unit and integration suites actually cover the changes
  # the Windows job is verifying.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore TarkovCompanion.sln --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false
      - name: Build
        run: dotnet build TarkovCompanion.sln --configuration Release --no-restore --maxcpucount:1
      - name: Test
        run: dotnet test TarkovCompanion.sln --configuration Release --no-build --no-restore --maxcpucount:1 --logger "trx;LogFileName=tests.trx"
      - name: Safety audit
        run: ./scripts/audit-safety.sh
      - name: Secret-pattern audit
        run: ./scripts/scan-secrets.sh
      # The group server ships self-contained so the machine hosting it needs no .NET
      # installed and no runtime kept in step with the build. One directory, one unit file.
      - name: Publish the group server for Linux
        run: |
          dotnet publish src/TarkovCompanion.GroupServer/TarkovCompanion.GroupServer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            --output artifacts/group-server
      - uses: actions/upload-artifact@v5
        with:
          name: TarkovCompanion-GroupServer-linux-x64
          path: artifacts/group-server/**
          if-no-files-found: error
      # Also packed as a release asset, because a CI artifact needs a token to download and the
      # server has to be able to fetch its own updates unattended. There is no interface to log
      # into it and press a button, so if it cannot reach a build without a person it will
      # simply fall behind the client, and the two now have to speak the same protocol.
      - name: Pack the group server for release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Reproducible on purpose. The relay's updater compares the published checksum
          # against the one it installed and restarts when they differ, and fresh mtimes,
          # owners and directory order made the hash change on every green run — so nearly
          # every merge to main restarted the relay whether or not the server had changed,
          # twice an hour, each time taking the squad's marks with it.
          #
          # gzip is given -n separately because it stamps its own mtime into the header, which
          # tar's -z would not suppress.
          tar -C artifacts/group-server \
            --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - . | gzip -n > dist/TarkovCompanion-GroupServer-linux-x64.tar.gz
          ( cd dist && sha256sum TarkovCompanion-GroupServer-linux-x64.tar.gz > GROUPSERVER-SHA256SUMS.txt )
          cat dist/GROUPSERVER-SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: group-server-release
          path: |
            dist/TarkovCompanion-GroupServer-linux-x64.tar.gz
            dist/GROUPSERVER-SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  # Waits for the checks rather than running beside them.
  #
  # The two jobs were independent, and they do not build the same thing: this one publishes
  # only the application for win-x64, while the checks compile the test projects too. So a
  # compile error in a test failed the checks and left this job green, and it published a
  # build that had failed its run to the feed the application updates itself from. That
  # happened twice. Moving the gate inside this job did not help, because the failure was
  # never in this job.
  #
  # Serialising costs the few minutes the checks take. A build that failed its run reaching
  # somebody's machine costs more than that.
  windows-verify:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Report runner session facts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "verification" -Force | Out-Null
          $Geometry = "unavailable"
          try {
            Add-Type -AssemblyName System.Windows.Forms
            $Bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $Geometry = "$($Bounds.Width)x$($Bounds.Height)"
          } catch {
            $Geometry = "error: $($_.Exception.Message)"
          }
          $Facts = [ordered]@{
            os = [System.Environment]::OSVersion.VersionString
            userInteractive = [System.Environment]::UserInteractive
            userName = [System.Environment]::UserName
            virtualScreen = $Geometry
          }
          $Facts | ConvertTo-Json | Set-Content -LiteralPath "verification/runner-session.json" -Encoding utf8
          $Facts | ConvertTo-Json

      - name: Restore
        run: dotnet restore TarkovCompanion.sln --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false

      - name: Restore win-x64 publish graphs
        run: |
          dotnet restore src/TarkovCompanion.App/TarkovCompanion.App.csproj --runtime win-x64 --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false
          dotnet restore src/TarkovCompanion.EftSimulator/TarkovCompanion.EftSimulator.csproj --runtime win-x64 --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false

      - name: Package self-contained win-x64
        id: package
        shell: bash
        env:
          # The build's version, decided here and used by both the stamp inside the package
          # and the installer that delivers it. They were separate numbers, so BUILD_INFO.txt
          # read "1.0.0" on every build ever made while the installer said 1.0.<run>, and a
          # report of "version 1.0.0" named no particular build.
          TARKOV_BUILD_VERSION: 1.0.${{ github.run_number }}
        run: ./scripts/package-windows.sh

      - name: Extract package the way a user would
        shell: powershell
        run: |
          $Target = Join-Path $env:RUNNER_TEMP "TarkovCompanion"
          New-Item -ItemType Directory -Path $Target -Force | Out-Null
          Expand-Archive -LiteralPath "dist/TarkovCompanion-v1.0.0-win-x64.zip" -DestinationPath $Target -Force
          "TC_APP=$(Join-Path $Target 'TarkovCompanion.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TC_SIMULATOR=$(Join-Path $Target 'TarkovCompanion.EftSimulator.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content -LiteralPath (Join-Path $Target "BUILD_INFO.txt")

      - name: Headless self-test on a clean machine
        id: self-test-cold
        continue-on-error: true
        timeout-minutes: 6
        shell: powershell
        run: |
          $Report = Join-Path $env:GITHUB_WORKSPACE "verification/self-test-cold.json"
          $Process = Start-Process -FilePath $env:TC_APP -ArgumentList @("--self-test", "--output", $Report) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "verification/self-test-cold.out.txt" `
            -RedirectStandardError "verification/self-test-cold.err.txt"
          Get-Content -LiteralPath "verification/self-test-cold.err.txt" -Raw
          if (Test-Path -LiteralPath $Report) { Get-Content -LiteralPath $Report -Raw }
          exit $Process.ExitCode

      - name: Headless demo raid replay
        id: demo-replay
        continue-on-error: true
        shell: powershell
        run: |
          $Report = Join-Path $env:GITHUB_WORKSPACE "verification/demo-replay.json"
          $Process = Start-Process -FilePath $env:TC_APP -ArgumentList @("--demo", "--headless", "--output", $Report) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "verification/demo-replay.out.txt" `
            -RedirectStandardError "verification/demo-replay.err.txt"
          Get-Content -LiteralPath "verification/demo-replay.err.txt" -Raw
          if (Test-Path -LiteralPath $Report) { Get-Content -LiteralPath $Report -Raw }
          exit $Process.ExitCode

      - name: Reset local application data
        shell: powershell
        run: |
          # The headless checks above already created the database, profile and OCR model.
          # Removing them makes the launch probe a genuine first run, which is the case that
          # actually needs proving.
          $Root = Join-Path $env:LOCALAPPDATA "TarkovCompanion"
          if (Test-Path -LiteralPath $Root) { Remove-Item -LiteralPath $Root -Recurse -Force }
          "Local application data reset: $Root"

      - name: First-run desktop launch probe
        id: launch-probe
        continue-on-error: true
        timeout-minutes: 8
        shell: powershell
        run: |
          ./scripts/windows-launch-probe.ps1 `
            -AppPath $env:TC_APP `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE "verification/launch-probe.json") `
            -ScreenshotPath (Join-Path $env:GITHUB_WORKSPACE "verification/launch-probe.png")

      # Opens every destination in turn, photographs it, and now checks what it got.
      #
      # Presenting a window was the only thing ever asserted, which is how a ragged sidebar
      # shipped: the picture was taken and nobody looked. The toolkit's own warnings are now
      # captured per page and a fault fails the step - a value that will not convert, a
      # resource that is not there, a path that cannot be resolved. Binding through a null
      # object is counted and reported instead, because every optional panel does it. How
      # much each page drew is measured and reported alongside them.
      - name: Photograph every destination
        id: page-gallery
        continue-on-error: true
        timeout-minutes: 12
        shell: powershell
        run: |
          ./scripts/windows-page-gallery.ps1 `
            -AppPath $env:TC_APP `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE "verification/page-gallery.json") `
            -ScreenshotDirectory (Join-Path $env:GITHUB_WORKSPACE "verification/pages")

      - name: Headless self-test after first run
        id: self-test-warm
        continue-on-error: true
        timeout-minutes: 6
        shell: powershell
        run: |
          $Report = Join-Path $env:GITHUB_WORKSPACE "verification/self-test-warm.json"
          $Process = Start-Process -FilePath $env:TC_APP -ArgumentList @("--self-test", "--output", $Report) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "verification/self-test-warm.out.txt" `
            -RedirectStandardError "verification/self-test-warm.err.txt"
          Get-Content -LiteralPath "verification/self-test-warm.err.txt" -Raw
          if (Test-Path -LiteralPath $Report) { Get-Content -LiteralPath $Report -Raw }
          exit $Process.ExitCode

      - name: Inventory local application data
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "verification" -Force | Out-Null
          $Root = Join-Path $env:LOCALAPPDATA "TarkovCompanion"
          if (Test-Path -LiteralPath $Root) {
            Get-ChildItem -LiteralPath $Root -Recurse -File |
              Select-Object @{ n = "path"; e = { $_.FullName.Substring($Root.Length + 1) } }, Length |
              Sort-Object path |
              ConvertTo-Json -Depth 4 |
              Set-Content -LiteralPath "verification/local-appdata.json" -Encoding utf8
            Get-Content -LiteralPath "verification/local-appdata.json" -Raw

            $StartupLog = Join-Path $Root "Logs\startup.log"
            if (Test-Path -LiteralPath $StartupLog) {
              Copy-Item -LiteralPath $StartupLog -Destination "verification/startup.log" -Force
              Get-Content -LiteralPath $StartupLog -Raw
            }

            $Database = Join-Path $Root "Database\tarkov-companion.db"
            if (Test-Path -LiteralPath $Database) {
              Copy-Item -LiteralPath $Database -Destination "verification/tarkov-companion.db" -Force
            }
          } else {
            "The application never created $Root." | Set-Content -LiteralPath "verification/local-appdata.json" -Encoding utf8
          }

      - name: Developer diagnostic smoke with the simulator
        id: developer-smoke
        continue-on-error: true
        timeout-minutes: 20
        shell: powershell
        run: |
          ./scripts/windows-smoke.ps1 `
            -AppPath $env:TC_APP `
            -SimulatorPath $env:TC_SIMULATOR `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE "verification/windows-smoke.json")

      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-verification
          path: verification/**
          if-no-files-found: warn

      # The gate, and deliberately ahead of every publish step.
      #
      # Each verification above is continue-on-error, so it records its result and lets the
      # job carry on. That meant the job's own success() was still true when the release was
      # published, and a build whose developer smoke had failed was offered as an update while
      # this step was still to run. Publishing before the gate makes "only verified builds are
      # offered" a claim rather than a property.
      - name: Summarize and fail on any unverified step
        if: always()
        shell: powershell
        run: |
          $Steps = [ordered]@{
            "self-test-cold" = "${{ steps.self-test-cold.outcome }}"
            "demo-replay" = "${{ steps.demo-replay.outcome }}"
            "launch-probe" = "${{ steps.launch-probe.outcome }}"
            "page-gallery" = "${{ steps.page-gallery.outcome }}"
            "self-test-warm" = "${{ steps.self-test-warm.outcome }}"
            "developer-smoke" = "${{ steps.developer-smoke.outcome }}"
          }

          $Lines = @("| Verification | Outcome |", "| --- | --- |")
          foreach ($Name in $Steps.Keys) {
            $Lines += "| $Name | $($Steps[$Name]) |"
          }
          ($Lines -join [Environment]::NewLine) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $Failed = @($Steps.Keys | Where-Object { $Steps[$_] -ne "success" })
          if ($Failed.Count -gt 0) {
            Write-Host ("Windows verification failed: " + ($Failed -join ", "))
            exit 1
          }

          Write-Host "Every Windows verification step passed."
      - name: Publish the verified package
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: TarkovCompanion-win-x64
          path: |
            dist/TarkovCompanion-v1.0.0-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: warn

      # Velopack turns the verified publish directory into an installer plus a delta feed.
      #
      # This replaced a hand-written swap script that never once completed on a real machine.
      # The application was unpacked from a zip onto a OneDrive-synced Desktop, where the sync
      # client holds handles on the folder continuously, so a directory rename could not
      # succeed and mirroring file by file only moved the failure to whichever file was locked
      # when it arrived. Velopack installs per user under LocalAppData, which nothing syncs,
      # and it owns the restart, so the process is gone before its files are touched.
      #
      # The version carries the run number so every verified build is strictly newer than the
      # last one. Velopack compares versions and will not offer a build it considers older.
      - name: Collect the group server build
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/download-artifact@v5
        with:
          name: group-server-release
          path: dist

      - name: Pack the installer and the update feed
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global vpk
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Must match the version the packaging script stamped into BUILD_INFO.txt, or the
          # file inside the install and the installer that delivered it name different builds.
          VERSION="1.0.${{ github.run_number }}"
          echo "VELOPACK_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Packs what verification actually launched, not a fresh build of it.
          # The pack id is the INSTALL DIRECTORY NAME, and it must not be the name the
          # application already uses for its data. Velopack installs to
          # %LOCALAPPDATA%\<packId>, and AppDataPaths.Resolve puts the database, cache,
          # config and logs in %LOCALAPPDATA%\TarkovCompanion. Naming the pack
          # "TarkovCompanion" pointed both at one directory, so installing renamed the
          # player's data aside to make room for the program. It did that for real, to a
          # 114 MB database, and only a failed install left the rename target behind to
          # recover from. A successful one would have been worse.
          vpk pack \
            --packId TarkovCompanionDesktop \
            --packVersion "$VERSION" \
            --packDir artifacts/win-x64 \
            --mainExe TarkovCompanion.exe \
            --packTitle "Tarkov Companion" \
            --packAuthors "Clayton Mannerow" \
            --icon artifacts/win-x64/Assets/TarkovCompanion.ico \
            --outputDir dist/velopack
          ls -la dist/velopack

          # Every published file gets a checksum, not just the legacy zip. A corrupt
          # download is otherwise discovered halfway through an install, with the data
          # directory already renamed aside; that is exactly how this was found.
          ( cd dist/velopack && sha256sum * > ../VELOPACK-SHA256SUMS.txt )
          cat dist/VELOPACK-SHA256SUMS.txt

      # A tag cuts a release that stays. The rolling pre-release below is what the group
      # actually runs and is replaced constantly; a tagged release is a build somebody
      # decided to keep, and it is never deleted or moved.
      - name: Publish a tagged release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "$TAG"             --notes "Verified on Windows: built, tested, launched, and every page photographed. Install with TarkovCompanionDesktop-win-Setup.exe."             --verify-tag             dist/velopack/*             dist/VELOPACK-SHA256SUMS.txt             dist/SHA256SUMS.txt

      # One rolling pre-release, replaced on every verified build, so the application has a
      # fixed place to look for a newer version of itself. Only reached when every check above
      # passed, so nothing that failed verification is ever offered as an update.
      - name: Publish the verified build for in-app update
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          # The manifest is written by the packaging script, from the same values it stamped
          # into BUILD_INFO.txt, so the two can never disagree about the build they describe.
          test -s dist/update.json
          VERSION="$(jq -r .version dist/update.json)"

          # Refuse to go backwards. Two main runs started four seconds apart once and the
          # older commit finished last, so `dev` ended up on the older build — and the relay,
          # which follows the feed by checksum alone, would have followed it backwards too.
          # The concurrency group above makes that unlikely; this makes it harmless.
          PUBLISHED=""
          if gh release download dev --repo "$REPO" --pattern update.json --dir /tmp/feed --clobber 2>/dev/null; then
            PUBLISHED="$(jq -r .version /tmp/feed/update.json 2>/dev/null || echo "")"
          fi
          if [ -n "$PUBLISHED" ] && [ "$PUBLISHED" != "$VERSION" ] \
             && [ "$(printf '%s\n%s\n' "$PUBLISHED" "$VERSION" | sort -V | tail -1)" = "$PUBLISHED" ]; then
            echo "Refusing to publish $VERSION over the newer $PUBLISHED already on dev." >&2
            exit 1
          fi

          # Created if absent, never deleted. Delete-then-create left the install link, the
          # update feed and the relay updater all pointing at nothing when the create failed
          # after the delete had succeeded — which happened twice — and it zeroed the download
          # counts on every single build.
          if ! gh release view dev --repo "$REPO" >/dev/null 2>&1; then
            git tag -f dev "${{ github.sha }}"
            git push -f origin dev
            gh release create dev \
              --repo "$REPO" \
              --title "Latest verified build" \
              --notes "placeholder" \
              --prerelease
          fi

          # Packages first, the two feed files last. Anything reading the feed mid-publish sees
          # the previous build, whole, rather than a half-written one; and a run cancelled
          # partway leaves the old feed pointing at assets that are all still present.
          gh release upload dev --repo "$REPO" --clobber \
            dist/velopack/* \
            dist/TarkovCompanion-GroupServer-linux-x64.tar.gz \
            dist/GROUPSERVER-SHA256SUMS.txt \
            dist/TarkovCompanion-v1.0.0-win-x64.zip
          gh release upload dev --repo "$REPO" --clobber \
            dist/VELOPACK-SHA256SUMS.txt \
            dist/SHA256SUMS.txt \
            dist/update.json

          # Stale packages last, once nothing points at them any more.
          #
          # --clobber only replaces an asset of the same name, and a Velopack package carries
          # its version in its filename, so not deleting left every build's nupkg on the
          # release for ever: ~70 MB a build, twice an hour. Deleting them before the upload
          # would have been worse — it is the delete-then-create hole in a smaller shape — so
          # they go after the feed has been repointed and they are genuinely unreferenced.
          gh release view dev --repo "$REPO" --json assets \
            --jq '.assets[].name | select(endswith(".nupkg"))' \
          | while read -r asset; do
              case "$asset" in
                *"-${VERSION}-"*) ;;
                *) echo "removing superseded $asset"
                   gh release delete-asset dev "$asset" --repo "$REPO" --yes || true ;;
              esac
            done

          # The tag follows the build rather than being recreated with it.
          git tag -f dev "${{ github.sha }}"
          git push -f origin dev
          gh release edit dev \
            --repo "$REPO" \
            --title "Latest verified build" \
            --notes "Replaced on every build that passes Windows verification. Commit ${{ github.sha }}. Install with TarkovCompanionDesktop-win-Setup.exe; after that the application updates itself." \
            --prerelease

