name: Windows verification

# Behavioral verification of the packaged Windows build on a GitHub-hosted
# Windows runner. The maintainer's workstation must never build or run this
# project, and the remote development container is Linux, so a hosted Windows
# runner is the only sanctioned place to prove that the shipped package
# actually starts and works.
#
# Escape from Tarkov is not installed on the runner and is not required. Nothing
# here reads game memory, sends input to another process, or inspects network
# traffic.
#
# TarkovCompanion.exe is a WinExe. PowerShell does not wait for GUI-subsystem
# processes, so every headless invocation below goes through Start-Process
# -Wait -PassThru and reads ExitCode from the returned process.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Not on pull requests. This run is the gate on what is PUBLISHED, not on what is merged:
  # publish.yml accepts only a successful push-to-main run of this workflow, so a package that
  # cannot open a window still never reaches anybody's machine. As a merge gate it cost fifteen
  # to thirty minutes per push on every branch, and with `main` required to be current that was
  # one full run per pull request per merge. To run it on a branch before merging, dispatch it:
  #   gh workflow run windows-verify.yml --ref <branch>

# One run at a time per ref, and a run on `main` is never cancelled by the next push.
#
# It used to be: an older run was cancelled rather than queued, so that two main runs could not
# finish out of order. That was safe while a merge took an hour. Merges are now minutes apart, and
# with cancellation every run on `main` was killed by the next merge before it could finish, so no
# build was ever published: three in a row on 2026-09-20. The concurrency group alone already
# serialises runs, which is what prevents out-of-order finishes; GitHub keeps the running one and
# only the newest waiting one, so the build that gets published lags the trunk by at most one run.
# A branch dispatch is still superseded by a newer dispatch of the same branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only throughout. Publishing lives in publish.yml, so a pull-request run has no step
# that could publish and no token that could.
#
# The exposure was never a stranger: smartpbx is the only collaborator with push, fork PRs get
# a read-only token with no secrets, and there is no pull_request_target anywhere. This is the
# structure saying so rather than a comment saying so.
permissions:
  contents: read

jobs:
  # Runs alongside the Windows job so a compile error or a failing test surfaces without
  # waiting on packaging, and so the unit and integration suites actually cover the changes
  # the Windows job is verifying.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'
      # The version of this build, decided once by scripts/build-version.sh and read by every
      # step below from TARKOV_BUILD_VERSION. "1.0" used to be typed out nine times in
      # this file, six in front of the run number and three in the zip's name, so it never
      # moved and V2 shipped calling itself 1.0.x. No step spells a version any more, and the static check refuses one that does.
      - name: Decide the build version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(./scripts/build-version.sh "${{ github.run_number }}")"
          echo "TARKOV_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "This build is $VERSION."

      - name: Build the player changelog
        shell: bash
        run: python3 scripts/generate-player-changelog.py --version "${TARKOV_BUILD_VERSION}"
      - name: Restore
        run: dotnet restore TarkovCompanion.sln --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false
      - name: Build
        run: dotnet build TarkovCompanion.sln --configuration Release --no-restore --maxcpucount:1
      - name: Test
        run: dotnet test TarkovCompanion.sln --configuration Release --no-build --no-restore --maxcpucount:1 --logger "trx;LogFileName=tests.trx"
      - name: Safety audit
        run: ./scripts/audit-safety.sh
      - name: Secret-pattern audit
        run: ./scripts/scan-secrets.sh
      # The group server ships self-contained so the machine hosting it needs no .NET
      # installed and no runtime kept in step with the build. One directory, one unit file.
      - name: Publish the group server for Linux
        run: |
          dotnet publish src/TarkovCompanion.GroupServer/TarkovCompanion.GroupServer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:InformationalVersion="${TARKOV_BUILD_VERSION}+${{ github.sha }}" \
            --output artifacts/group-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TarkovCompanion-GroupServer-linux-x64
          path: artifacts/group-server/**
          if-no-files-found: error
      # Also packed as a release asset, because a CI artifact needs a token to download and the
      # server has to be able to fetch its own updates unattended. There is no interface to log
      # into it and press a button, so if it cannot reach a build without a person it will
      # simply fall behind the client, and the two now have to speak the same protocol.
      - name: Pack the group server for release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # The units and the updater travel with the build they update to.
          #
          # /opt/tarkov-group-update.sh and the unit files were installed by hand, once, by
          # whoever followed deploy/group-server/README.md, and the updater replaces the server
          # tree and nothing else. So every fix to deploy/group-server/ sat in the repo doing
          # nothing: CT 115 was still running the 13 September updater a day after its stamp
          # bug was fixed here, with the bug live.
          mkdir -p artifacts/group-server/deploy
          cp deploy/group-server/tarkov-group-update.sh \
             deploy/group-server/tarkov-group-update.service \
             deploy/group-server/tarkov-group-update.timer \
             deploy/group-server/tarkov-group-update.path \
             artifacts/group-server/deploy/
          # Reproducible on purpose. The relay's updater compares the published checksum
          # against the one it installed and restarts when they differ, and fresh mtimes,
          # owners and directory order made the hash change on every green run — so nearly
          # every merge to main restarted the relay whether or not the server had changed,
          # twice an hour, each time taking the squad's marks with it.
          #
          # gzip is given -n separately because it stamps its own mtime into the header, which
          # tar's -z would not suppress.
          tar -C artifacts/group-server \
            --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - . | gzip -n > dist/TarkovCompanion-GroupServer-linux-x64.tar.gz
          ( cd dist && sha256sum TarkovCompanion-GroupServer-linux-x64.tar.gz > GROUPSERVER-SHA256SUMS.txt )
          cat dist/GROUPSERVER-SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: group-server-release
          path: |
            dist/TarkovCompanion-GroupServer-linux-x64.tar.gz
            dist/GROUPSERVER-SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  # Waits for the checks rather than running beside them.
  #
  # The two jobs were independent, and they do not build the same thing: this one publishes
  # only the application for win-x64, while the checks compile the test projects too. So a
  # compile error in a test failed the checks and left this job green, and it published a
  # build that had failed its run to the feed the application updates itself from. That
  # happened twice. Moving the gate inside this job did not help, because the failure was
  # never in this job.
  #
  # Serialising costs the few minutes the checks take. A build that failed its run reaching
  # somebody's machine costs more than that.
  windows-verify:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'

      # The same decision the checks job made, from the same script and the same run number,
      # so the relay built there and the desktop built here carry one version.
      - name: Decide the build version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(./scripts/build-version.sh "${{ github.run_number }}")"
          echo "TARKOV_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "This build is $VERSION."

      - name: Build the player changelog
        shell: bash
        run: python scripts/generate-player-changelog.py --version "${TARKOV_BUILD_VERSION}"

      - name: Report runner session facts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "verification" -Force | Out-Null
          $Geometry = "unavailable"
          try {
            Add-Type -AssemblyName System.Windows.Forms
            $Bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $Geometry = "$($Bounds.Width)x$($Bounds.Height)"
          } catch {
            $Geometry = "unavailable"
          }
          $Facts = [ordered]@{
            os = [System.Environment]::OSVersion.VersionString
            userInteractive = [System.Environment]::UserInteractive
            virtualScreen = $Geometry
          }
          $Facts | ConvertTo-Json | Set-Content -LiteralPath "verification/runner-session.json" -Encoding utf8
          $Facts | ConvertTo-Json

      - name: Parse Windows verification scripts
        shell: powershell
        run: |
          # Keep syntax errors out of the expensive package/desktop stages. This is
          # deliberately parse-only: the hosted desktop probe remains the authority for
          # behavioral verification and is not replaced by a local or headless imitation.
          $Scripts = @(
            "scripts/windows-launch-probe.ps1",
            "scripts/windows-page-gallery.ps1",
            "scripts/windows-smoke.ps1",
            "scripts/windows-verification-evidence.ps1",
            "scripts/verify-windows-verification-static.ps1",
            "scripts/release/install-vpk.ps1",
            "scripts/release/install-offline.ps1"
          )
          foreach ($Script in $Scripts) {
            $ResolvedScript = (Resolve-Path -LiteralPath $Script).Path
            $Tokens = $null
            $ParseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $ResolvedScript,
              [ref] $Tokens,
              [ref] $ParseErrors) | Out-Null
            if (@($ParseErrors).Count -gt 0) {
              throw ("PowerShell parse errors in {0}: {1}" -f $Script, (@($ParseErrors | ForEach-Object Message) -join "; "))
            }
          }
          ./scripts/verify-windows-verification-static.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE

      - name: Restore
        run: dotnet restore TarkovCompanion.sln --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false

      - name: Restore win-x64 publish graphs
        run: |
          dotnet restore src/TarkovCompanion.App/TarkovCompanion.App.csproj --runtime win-x64 -p:PublishReadyToRun=true --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false
          dotnet restore src/TarkovCompanion.EftSimulator/TarkovCompanion.EftSimulator.csproj --runtime win-x64 --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false

      # The developer smoke reads durable rows through the native SQLite library the package
      # ships, because Windows PowerShell 5.1 cannot load the net10.0 Microsoft.Data.Sqlite
      # assembly. That reader is exercised here, under the same PowerShell, against a fixture
      # database and the restored copy of the same library, rather than found broken twenty
      # minutes into the job.
      - name: Check the smoke's SQLite reader against a fixture database
        shell: powershell
        run: |
          $Candidates = @(Get-ChildItem -Path (Join-Path $env:NUGET_PACKAGES "sqlitepclraw.lib.e_sqlite3\*\runtimes\win-x64\native\e_sqlite3.dll"))
          if ($Candidates.Count -ne 1) {
            throw "Expected exactly one restored win-x64 e_sqlite3.dll, found $($Candidates.Count)."
          }
          ./scripts/verify-windows-verification-static.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -SqliteLibraryPath $Candidates[0].FullName

      - name: Package self-contained win-x64
        id: package
        shell: bash
        # Reads TARKOV_BUILD_VERSION, so the stamp inside the package and the installer that
        # delivers it are one number. They were separate once: BUILD_INFO.txt said the same
        # fixed version on every build ever made while the installer counted runs, and a bug
        # report naming that version named no particular build. It writes TARKOV_PACKAGE_ZIP,
        # the zip it made, for the steps that extract and upload it.
        run: ./scripts/package-windows.sh

      - name: Extract package the way a user would
        shell: powershell
        run: |
          $Target = Join-Path $env:RUNNER_TEMP "TarkovCompanion"
          New-Item -ItemType Directory -Path $Target -Force | Out-Null
          # Empty would not fail by itself further down: the launch probe treats an empty
          # expected version as "do not check", so a misspelt variable would pass every
          # version assertion in this job by matching nothing.
          if ([string]::IsNullOrWhiteSpace($env:TARKOV_BUILD_VERSION) -or [string]::IsNullOrWhiteSpace($env:TARKOV_PACKAGE_ZIP)) {
            throw "The build version or the package path was not decided before this step."
          }
          if ((Split-Path -Leaf $env:TARKOV_PACKAGE_ZIP) -cne "TarkovCompanion-v$($env:TARKOV_BUILD_VERSION)-win-x64.zip") {
            throw "The package is named $($env:TARKOV_PACKAGE_ZIP), which does not carry version $($env:TARKOV_BUILD_VERSION)."
          }
          Expand-Archive -LiteralPath $env:TARKOV_PACKAGE_ZIP -DestinationPath $Target -Force
          "TC_APP=$(Join-Path $Target 'TarkovCompanion.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TC_SIMULATOR=$(Join-Path $Target 'TarkovCompanion.EftSimulator.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $BuildInfo = @{}
          foreach ($Line in Get-Content -LiteralPath (Join-Path $Target "BUILD_INFO.txt")) {
            if ($Line -match '^(?<key>[a-z_]+)=(?<value>.+)$') { $BuildInfo[$Matches.key] = $Matches.value }
          }
          if ($BuildInfo.version -cne $env:TARKOV_BUILD_VERSION -or $BuildInfo.commit -cne "${{ github.sha }}") {
            throw "Extracted package metadata does not match the expected GitHub version and commit."
          }
          "Extracted package metadata matches the expected GitHub version and commit."

      # Packed here rather than after the gate, because the installer is now something the
      # gate tests rather than something it produces once everything else has passed. Same
      # bits either way: this packs artifacts/win-x64, which is exactly what the zip the
      # probes launch was made from.
      - name: Install Velopack CLI by content
        shell: powershell
        run: |
          $Vpk = ./scripts/release/install-vpk.ps1 `
            -Destination (Join-Path $env:RUNNER_TEMP "vpk-tools")
          "VPK_PATH=$Vpk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Pack the installer and the update feed
        shell: bash
        run: |
          set -euo pipefail
          # Must match the version the packaging script stamped into BUILD_INFO.txt, or the
          # file inside the install and the installer that delivered it name different builds.
          VERSION="${TARKOV_BUILD_VERSION}"
          # Packs what verification actually launched, not a fresh build of it.
          # The pack id is the INSTALL DIRECTORY NAME, and it must not be the name the
          # application already uses for its data. Velopack installs to
          # %LOCALAPPDATA%\<packId>, and AppDataPaths.Resolve puts the database, cache,
          # config and logs in %LOCALAPPDATA%\TarkovCompanion. Naming the pack
          # "TarkovCompanion" pointed both at one directory, so installing renamed the
          # player's data aside to make room for the program. It did that for real, to a
          # 114 MB database, and only a failed install left the rename target behind to
          # recover from. A successful one would have been worse.
          "$VPK_PATH" pack \
            --packId TarkovCompanionDesktop \
            --packVersion "$VERSION" \
            --packDir artifacts/win-x64 \
            --mainExe TarkovCompanion.exe \
            --packTitle "Tarkov Companion" \
            --packAuthors "Clayton Mannerow" \
            --icon artifacts/win-x64/Assets/TarkovCompanion.ico \
            --outputDir dist/velopack
          ls -la dist/velopack

          # Every published file gets a checksum, not just the legacy zip. A corrupt
          # download is otherwise discovered halfway through an install, with the data
          # directory already renamed aside; that is exactly how this was found.
          ( cd dist/velopack && sha256sum -- * > ../VELOPACK-SHA256SUMS.txt )
          cat dist/VELOPACK-SHA256SUMS.txt

      # The rough channel: the folder an operator copies onto the relay so an installed rough
      # build can update itself (docs/RELEASES.md, "The rough channel"). Staged on every run,
      # pull requests included, because staging is also the check: it fails the job if the
      # package the packaging tool wrote is not the package its own feed describes, which is
      # the comparison every desktop makes before it installs.
      - name: Stage the rough update channel
        shell: powershell
        run: |
          python scripts/release/rough_channel.py stage `
            --velopack dist/velopack --output dist/rough-channel `
            --expect-version $env:TARKOV_BUILD_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Staging the rough update channel failed." }
          Get-Content -LiteralPath dist/rough-channel/SHA256SUMS.txt

      - name: Build the versioned data and model components
        shell: powershell
        run: |
          python scripts/release/build_components.py `
            --source . --output dist --update dist/update.json
          if ($LASTEXITCODE -ne 0) { throw "Building release components failed." }
          Get-Content -LiteralPath dist/COMPONENT-SHA256SUMS.txt

      - name: Headless self-test on a clean machine
        id: self-test-cold
        continue-on-error: true
        timeout-minutes: 6
        shell: powershell
        run: |
          $Report = Join-Path $env:GITHUB_WORKSPACE "verification/self-test-cold.json"
          $Process = Start-Process -FilePath $env:TC_APP -ArgumentList @("--self-test", "--output", $Report) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "verification/self-test-cold.out.txt" `
            -RedirectStandardError "verification/self-test-cold.err.txt"
          if (Test-Path -LiteralPath $Report) {
            $SelfTest = Get-Content -LiteralPath $Report -Raw | ConvertFrom-Json
            "Cold self-test success: $($SelfTest.success)"
            # What the binary says it is, against what it was packaged as. BUILD_INFO.txt is a
            # file beside the executable and was already checked; this is the executable's own
            # answer, which is what Setup, the crash log and a support bundle all print.
            if ($SelfTest.build.version -cne $env:TARKOV_BUILD_VERSION -or $SelfTest.build.commit -cne "${{ github.sha }}") {
              throw "The packaged application reports build '$($SelfTest.build.version)' at '$($SelfTest.build.commit)', not the version and commit it was packaged as."
            }
          }
          exit $Process.ExitCode

      - name: Headless demo raid replay
        id: demo-replay
        continue-on-error: true
        shell: powershell
        run: |
          $Report = Join-Path $env:GITHUB_WORKSPACE "verification/demo-replay.json"
          $Process = Start-Process -FilePath $env:TC_APP -ArgumentList @("--demo", "--headless", "--output", $Report) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "verification/demo-replay.out.txt" `
            -RedirectStandardError "verification/demo-replay.err.txt"
          # DemoRaidReplayReport has no success field; complete is the one its exit code follows.
          if (Test-Path -LiteralPath $Report) {
            $DemoReplay = Get-Content -LiteralPath $Report -Raw | ConvertFrom-Json
            "Demo replay complete: $($DemoReplay.complete)"
          }
          exit $Process.ExitCode

      - name: Reset local application data
        shell: powershell
        run: |
          # The headless checks above already created the database, profile and OCR model.
          # Removing them makes the launch probe a genuine first run, which is the case that
          # actually needs proving.
          $Root = Join-Path $env:LOCALAPPDATA "TarkovCompanion"
          if (Test-Path -LiteralPath $Root) { Remove-Item -LiteralPath $Root -Recurse -Force }
          "Local application data reset."

      - name: First-run desktop launch probe
        id: launch-probe
        continue-on-error: true
        timeout-minutes: 8
        shell: powershell
        run: |
          ./scripts/windows-launch-probe.ps1 `
            -AppPath $env:TC_APP `
            -ExpectedVersion $env:TARKOV_BUILD_VERSION `
            -ExpectedCommit "${{ github.sha }}" `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE "verification/launch-probe.json") `
            -ScreenshotPath (Join-Path $env:GITHUB_WORKSPACE "verification/launch-probe.png")

      # A native fault raises no managed exception, so the crash log and the probe report are both
      # empty and the only record is Windows' own. This is what named the 2.0.1278 launch crash
      # (Skia's PNG encoder, reached from the tablet publisher) in one run, after a bisect had not.
      - name: Name the fault if the launch died natively
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1,2,3 } -MaxEvents 40 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error', '.NET Runtime', 'Windows Error Reporting' } |
            ForEach-Object { "DIAG-EVENT $($_.TimeCreated.ToString('o')) [$($_.ProviderName)] $($_.Id)"; ($_.Message -split "`n" | Select-Object -First 30 | ForEach-Object { "DIAG   $_" }) }
          $Root = Join-Path $env:LOCALAPPDATA "TarkovCompanion"
          Get-ChildItem -LiteralPath $Root -Recurse -Filter "breadcrumbs*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            "DIAG-BREADCRUMBS $($_.Name)"
            Get-Content -LiteralPath $_.FullName -Tail 40 | ForEach-Object { "DIAG   $_" }
          }

      # Fails a launch that shows no responsive, visually varied window, whose toolkit reported
      # an interface fault, whose warning capture was never armed, or whose required packaged-shell
      # UI Automation interaction failed. Legacy, V2 A and V2 B are launched and captured; both V2
      # variants are also exercised at narrow width. V2 additionally traverses every retained route
      # and asserts selected focus, dialog, title and deep-link behavior. It does not prove full
      # usability/accessibility or map tile/data readiness: those #279 criteria stay open and depend
      # on the application readiness signal owned by #281, which this workflow does not duplicate.
      - name: Photograph every destination
        id: page-gallery
        continue-on-error: true
        timeout-minutes: 35
        shell: powershell
        run: |
          ./scripts/windows-page-gallery.ps1 `
            -AppPath $env:TC_APP `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE "verification/page-gallery.json") `
            -ScreenshotDirectory (Join-Path $env:GITHUB_WORKSPACE "verification/pages")

      # V2 rough package 30 (acceptance sweep): the V2 route captures themselves, so a later run
      # can be looked at rather than only counted. Deliberately narrow, and deliberately not the
      # whole screenshot directory: these are the V2 shell's own surfaces on a machine that has
      # not yet been given any game data or profile, photographed before the "Seed the data a
      # user would already have" step below. The Events page is excluded because it prints the
      # local configuration directory, which carries the runner account name; everything the
      # sanitizer already covers stays in the windows-verification artifact instead.
      - name: Publish the V2 route captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v2-route-gallery
          path: |
            verification/pages/v2-a-*.png
            !verification/pages/v2-a-plan-events-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Headless self-test after first run
        id: self-test-warm
        continue-on-error: true
        timeout-minutes: 6
        shell: powershell
        run: |
          $Report = Join-Path $env:GITHUB_WORKSPACE "verification/self-test-warm.json"
          $Process = Start-Process -FilePath $env:TC_APP -ArgumentList @("--self-test", "--output", $Report) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "verification/self-test-warm.out.txt" `
            -RedirectStandardError "verification/self-test-warm.err.txt"
          if (Test-Path -LiteralPath $Report) {
            $SelfTest = Get-Content -LiteralPath $Report -Raw | ConvertFrom-Json
            "Warm self-test success: $($SelfTest.success)"
          }
          exit $Process.ExitCode

      # The installer has never been run by anything but Clayton.
      #
      # Every probe above runs from the extracted zip, so the one thing a user actually does
      # first was the one step nothing checked. The only real install failure there has ever
      # been was an installer-level defect this gate could not see: the pack id was
      # "TarkovCompanion", Velopack installs to %LOCALAPPDATA%\<packId>, and AppDataPaths puts
      # the database there too — so installing renamed a 114 MB database aside to make room for
      # the program. AppDataPathsTests pins the data path against AppContext.BaseDirectory and
      # knows nothing about the --packId in this file, so one line here reintroduces it.
      #
      # The marker is the assertion. Seed the data directory, install, and require that what was
      # there before is still there afterwards.
      - name: Seed the data a user would already have
        shell: powershell
        run: |
          $Root = Join-Path $env:LOCALAPPDATA "TarkovCompanion"
          New-Item -ItemType Directory -Path $Root -Force | Out-Null
          # Deliberately not named like the database. A file called tarkov-companion.db full
          # of prose is a corrupt database, and the application would then fail for a reason
          # this step invented rather than for the reason it is testing.
          $Marker = Join-Path $Root "install-marker.txt"
          "the data a user already had" | Set-Content -LiteralPath $Marker -Encoding utf8
          "TC_MARKER=$Marker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Seeded install-preservation marker."

      - name: Install the way a user would
        id: install
        timeout-minutes: 8
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Setup = Get-ChildItem -LiteralPath "dist/velopack" -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $Setup) { throw "No Setup.exe was packed." }
          "Running the packaged installer."

          # --silent so nothing waits for a window that a runner has nobody to close. The exit
          # code is the installer's own verdict and is not swallowed.
          $Process = Start-Process -FilePath $Setup.FullName -ArgumentList @("--silent") -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "The installer exited $($Process.ExitCode)." }

          $Installed = Join-Path $env:LOCALAPPDATA "TarkovCompanionDesktop/current/TarkovCompanion.exe"
          if (-not (Test-Path -LiteralPath $Installed)) {
            throw "The installer reported success but the application was not installed."
          }

          # The regression. A pack id that collides with the data directory renames it aside.
          if (-not (Test-Path -LiteralPath $env:TC_MARKER)) {
            throw "Installing destroyed the existing application data marker."
          }

          $InstalledBuildInfo = @{}
          foreach ($Line in Get-Content -LiteralPath (Join-Path (Split-Path -Parent $Installed) "BUILD_INFO.txt")) {
            if ($Line -match '^(?<key>[a-z_]+)=(?<value>.+)$') { $InstalledBuildInfo[$Matches.key] = $Matches.value }
          }
          if ($InstalledBuildInfo.version -cne $env:TARKOV_BUILD_VERSION -or $InstalledBuildInfo.commit -cne "${{ github.sha }}") {
            throw "Installed package metadata does not match the expected GitHub version and commit."
          }

          "TC_INSTALLED=$Installed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Installed package metadata and data preservation marker both match."

      # What was installed, rather than what was packed. A self-test here is the first thing in
      # this workflow that exercises the bytes a user will actually run, laid out the way the
      # installer laid them out.
      - name: Headless self-test of the installed application
        id: self-test-installed
        continue-on-error: true
        timeout-minutes: 6
        shell: powershell
        run: |
          $Report = Join-Path $env:GITHUB_WORKSPACE "verification/self-test-installed.json"
          $Process = Start-Process -FilePath $env:TC_INSTALLED -ArgumentList @("--self-test", "--output", $Report) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "verification/self-test-installed.out.txt" `
            -RedirectStandardError "verification/self-test-installed.err.txt"
          if (Test-Path -LiteralPath $Report) {
            $SelfTest = Get-Content -LiteralPath $Report -Raw | ConvertFrom-Json
            "Installed self-test success: $($SelfTest.success)"
            # The installed executable's own answer, which is the number Setup shows and the
            # updater compares with the feed. It has to be the version the installer carried.
            if ($SelfTest.build.version -cne $env:TARKOV_BUILD_VERSION -or $SelfTest.build.commit -cne "${{ github.sha }}") {
              throw "The installed application reports build '$($SelfTest.build.version)' at '$($SelfTest.build.commit)', not the version and commit it was installed as."
            }
          }
          exit $Process.ExitCode

      # An update, really applied. #599: four builds in a row were downloaded on the owner's PC
      # and none replaced the one running, and nothing here could have noticed, because this
      # workflow installed a build and never updated one. So: pack the same binaries again as
      # the next version, put that in a local feed, and have the installed application update
      # itself to it through the same gateway and hand-over as the button on Setup.
      #
      # Started standing in current\, which is where both shortcuts start it, and the probe
      # leaves a child running that inherits its working directory. A process standing in
      # current\ is what made the folder immovable, so this passes only if the application
      # left the install folder before it started anything.
      - name: Update the installed application to the next version
        id: update-applies
        continue-on-error: true
        timeout-minutes: 8
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Parts = $env:TARKOV_BUILD_VERSION.Split(".")
          $Parts[-1] = [string]([int]$Parts[-1] + 1)
          $Next = $Parts -join "."
          "Packing $Next from the binaries that were installed as $env:TARKOV_BUILD_VERSION."

          # Under the runner's temporary folder, not dist/: nothing of this may be published.
          $NextDir = Join-Path $env:RUNNER_TEMP "win-x64-next"
          $NextPack = Join-Path $env:RUNNER_TEMP "velopack-next"
          Copy-Item -LiteralPath "artifacts/win-x64" -Destination $NextDir -Recurse
          $BuildInfo = Join-Path $NextDir "BUILD_INFO.txt"
          # Written without a byte-order mark, which Set-Content -Encoding utf8 would add here.
          $Lines = @((Get-Content -LiteralPath $BuildInfo) -replace '^version=.+$', "version=$Next")
          [System.IO.File]::WriteAllLines($BuildInfo, [string[]]$Lines, (New-Object System.Text.UTF8Encoding $false))
          & $env:VPK_PATH pack --packId TarkovCompanionDesktop --packVersion $Next --packDir $NextDir `
            --mainExe TarkovCompanion.exe --packTitle "Tarkov Companion" --packAuthors "Clayton Mannerow" `
            --icon (Join-Path $NextDir "Assets/TarkovCompanion.ico") --outputDir $NextPack
          if ($LASTEXITCODE -ne 0) { throw "Packing the next version failed." }
          $Feed = Join-Path $env:RUNNER_TEMP "rough-channel-next"
          python scripts/release/rough_channel.py stage --velopack $NextPack --output $Feed --expect-version $Next
          if ($LASTEXITCODE -ne 0) { throw "Staging the next version's feed failed." }

          $Current = Split-Path -Parent $env:TC_INSTALLED
          $Report = Join-Path $env:GITHUB_WORKSPACE "verification/update-applies.json"
          $env:TARKOV_UPDATE_FEED = $Feed
          # Not -Wait: that waits for every descendant, and the updater and the reopened
          # application are descendants. The probe ends itself with TerminateProcess, so its exit
          # code is not a verdict either; the folder is.
          $Probe = Start-Process -FilePath $env:TC_INSTALLED -WorkingDirectory $Current -PassThru `
            -ArgumentList @("--apply-update-and-exit", "--output", $Report)
          if (-not $Probe.WaitForExit(120000)) {
            Stop-Process -Id $Probe.Id -Force -ErrorAction SilentlyContinue
            throw "The application was still running two minutes after it was asked to update."
          }
          if (Test-Path -LiteralPath $Report) { Get-Content -LiteralPath $Report }

          function Get-InstalledVersion {
            $Path = Join-Path $Current "BUILD_INFO.txt"
            if (-not (Test-Path -LiteralPath $Path)) { return $null }
            foreach ($Line in Get-Content -LiteralPath $Path -ErrorAction SilentlyContinue) {
              if ($Line -match '^version=(?<value>.+)$') { return $Matches.value }
            }
            return $null
          }

          # The updater gives up after ten one-second retries, so ninety seconds covers
          # extracting the package and either verdict.
          $Deadline = (Get-Date).AddSeconds(90)
          $Reopened = $null
          while ((Get-Date) -lt $Deadline) {
            $Reopened = Get-Process -Name "TarkovCompanion" -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -and $_.Path.StartsWith($Current, [StringComparison]::OrdinalIgnoreCase) } |
              Select-Object -First 1
            if ($Reopened) { break }
            Start-Sleep -Seconds 2
          }
          $Applied = Get-InstalledVersion

          # Tidy up before the verdict, so a failure does not leave a window and a ping behind
          # for the steps that follow.
          Get-Process -Name "TarkovCompanion" -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path.StartsWith($Current, [StringComparison]::OrdinalIgnoreCase) } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $Report) {
            $Bystander = (Get-Content -LiteralPath $Report -Raw | ConvertFrom-Json).bystanderPid
            if ($Bystander) { Stop-Process -Id $Bystander -Force -ErrorAction SilentlyContinue }
          }

          if ($Applied -cne $Next) {
            $Log = Join-Path $env:LOCALAPPDATA "velopack/velopack_TarkovCompanionDesktop.log"
            if (Test-Path -LiteralPath $Log) { Get-Content -LiteralPath $Log -Tail 40 }
            throw "The update did not apply: current\BUILD_INFO.txt says '$Applied', and '$Next' was downloaded and handed to the updater."
          }
          if (-not $Reopened) { throw "The update applied but the application did not reopen from current\ within ninety seconds." }
          if (-not (Test-Path -LiteralPath $env:TC_MARKER)) { throw "Updating destroyed the existing application data marker." }
          "Updated $env:TARKOV_BUILD_VERSION to $Next, the application reopened from current\, and the data marker is intact."

      # #292: and back again. The feed still holds only the next version, as the relay's does, so
      # the only way back is the copy of the original package the update kept in the data folder.
      # Same hand-over, same bystander, same standing in current\; the verdict is the folder.
      - name: Go back to the previous version
        id: rollback-applies
        if: steps.update-applies.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Current = Split-Path -Parent $env:TC_INSTALLED
          $Report = Join-Path $env:GITHUB_WORKSPACE "verification/rollback-applies.json"
          $env:TARKOV_UPDATE_FEED = Join-Path $env:RUNNER_TEMP "rough-channel-next"
          $ProbeErr = Join-Path $env:RUNNER_TEMP "rollback-probe-stderr.txt"
          $ProbeOut = Join-Path $env:RUNNER_TEMP "rollback-probe-stdout.txt"
          $Probe = Start-Process -FilePath $env:TC_INSTALLED -WorkingDirectory $Current -PassThru `
            -RedirectStandardError $ProbeErr -RedirectStandardOutput $ProbeOut `
            -ArgumentList @("--roll-back-and-exit", "--output", $Report)
          if (-not $Probe.WaitForExit(120000)) {
            Stop-Process -Id $Probe.Id -Force -ErrorAction SilentlyContinue
            throw "The application was still running two minutes after it was asked to go back."
          }
          if (Test-Path -LiteralPath $Report) { Get-Content -LiteralPath $Report }
          else {
            # No report means the probe never reached its own error handling: say what it did say.
            "No report. Probe exit code: $($Probe.ExitCode)"
            foreach ($File in @($ProbeOut, $ProbeErr)) { if (Test-Path -LiteralPath $File) { Get-Content -LiteralPath $File -Tail 40 } }
            $Logs = Join-Path $env:LOCALAPPDATA "TarkovCompanion/Logs"
            Get-ChildItem -LiteralPath $Logs -Filter "startup.log" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1 |
              ForEach-Object { Get-Content -LiteralPath $_.FullName -Tail 40 }
          }
          Get-ChildItem -LiteralPath (Join-Path (Split-Path -Parent $Current) "packages") -ErrorAction SilentlyContinue | ForEach-Object { "packages\$($_.Name) $($_.Length)" }
          Get-ChildItem -LiteralPath (Join-Path $env:LOCALAPPDATA "TarkovCompanion/Updates") -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName) $($_.Length)" }

          function Get-InstalledVersion {
            $Path = Join-Path $Current "BUILD_INFO.txt"
            if (-not (Test-Path -LiteralPath $Path)) { return $null }
            foreach ($Line in Get-Content -LiteralPath $Path -ErrorAction SilentlyContinue) {
              if ($Line -match '^version=(?<value>.+)$') { return $Matches.value }
            }
            return $null
          }

          # The version first, then the reopened process: a process standing in current\ before the
          # updater has swapped the folder is not the reopened build.
          $Deadline = (Get-Date).AddSeconds(90)
          $Reopened = $null
          $Applied = $null
          while ((Get-Date) -lt $Deadline) {
            $Applied = Get-InstalledVersion
            if ($Applied -ceq $env:TARKOV_BUILD_VERSION) {
              $Reopened = Get-Process -Name "TarkovCompanion" -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -and $_.Path.StartsWith($Current, [StringComparison]::OrdinalIgnoreCase) } |
                Select-Object -First 1
              if ($Reopened) { break }
            }
            Start-Sleep -Seconds 2
          }
          "After $([int]((Get-Date) - $Deadline.AddSeconds(-90)).TotalSeconds)s: current\ is '$Applied', reopened: $([bool]$Reopened)"
          Get-Process -Name "TarkovCompanion" -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path.StartsWith($Current, [StringComparison]::OrdinalIgnoreCase) } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $Report) {
            $Bystander = (Get-Content -LiteralPath $Report -Raw | ConvertFrom-Json).bystanderPid
            if ($Bystander) { Stop-Process -Id $Bystander -Force -ErrorAction SilentlyContinue }
          }

          if ($Applied -cne $env:TARKOV_BUILD_VERSION) {
            $Log = Join-Path $env:LOCALAPPDATA "velopack/velopack_TarkovCompanionDesktop.log"
            if (Test-Path -LiteralPath $Log) { Get-Content -LiteralPath $Log -Tail 40 }
            throw "Going back did not apply: current\BUILD_INFO.txt says '$Applied', expected '$env:TARKOV_BUILD_VERSION'."
          }
          if (-not $Reopened) { throw "Going back applied but the application did not reopen from current\ within ninety seconds." }
          if (-not (Test-Path -LiteralPath $env:TC_MARKER)) { throw "Going back destroyed the existing application data marker." }
          $State = Join-Path $env:LOCALAPPDATA "TarkovCompanion/Updates/update-state.json"
          if (-not (Select-String -LiteralPath $State -Pattern '"Pin"\s*:\s*\{' -Quiet)) { throw "Going back did not pin the version." }
          "Went back to $env:TARKOV_BUILD_VERSION from the kept copy, the application reopened, the data marker is intact, and the version is pinned."

      - name: Developer diagnostic smoke with the simulator
        id: developer-smoke
        continue-on-error: true
        timeout-minutes: 20
        shell: powershell
        run: |
          ./scripts/windows-smoke.ps1 `
            -AppPath $env:TC_APP `
            -SimulatorPath $env:TC_SIMULATOR `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE "verification/windows-smoke.json")

      - name: Create sanitized verification evidence
        if: always()
        shell: powershell
        run: |
          ./scripts/windows-verification-evidence.ps1 `
            -VerificationDirectory (Join-Path $env:GITHUB_WORKSPACE "verification") `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE "verification/evidence") `
            -LocalDataRoot (Join-Path $env:LOCALAPPDATA "TarkovCompanion")

      - name: Publish sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-verification
          path: |
            verification/evidence/windows-verification-summary.json
            verification/evidence/windows-verification-failures.txt
          if-no-files-found: error
          retention-days: 7

      # The gate, and deliberately ahead of every publish step.
      #
      # Each verification above is continue-on-error, so it records its result and lets the
      # job carry on. That meant the job's own success() was still true when the release was
      # published, and a build whose developer smoke had failed was offered as an update while
      # this step was still to run. Publishing before the gate makes "only verified builds are
      # offered" a claim rather than a property.
      - name: Summarize and fail on any unverified step
        if: always()
        shell: powershell
        run: |
          $Steps = [ordered]@{
            "self-test-cold" = "${{ steps.self-test-cold.outcome }}"
            "demo-replay" = "${{ steps.demo-replay.outcome }}"
            "launch-probe" = "${{ steps.launch-probe.outcome }}"
            "page-gallery" = "${{ steps.page-gallery.outcome }}"
            "self-test-warm" = "${{ steps.self-test-warm.outcome }}"
            "install" = "${{ steps.install.outcome }}"
            "self-test-installed" = "${{ steps.self-test-installed.outcome }}"
            "update-applies" = "${{ steps.update-applies.outcome }}"
            "rollback-applies" = "${{ steps.rollback-applies.outcome }}"
            "developer-smoke" = "${{ steps.developer-smoke.outcome }}"
          }

          $Lines = @("| Verification | Outcome |", "| --- | --- |")
          foreach ($Name in $Steps.Keys) {
            $Lines += "| $Name | $($Steps[$Name]) |"
          }
          $Lines += ""

          # Written from the sanitized evidence rather than the raw reports, so this says only what
          # the published artifact holds. It used to promise a page gallery and a cropped launch
          # probe, which were never in it, called a window-handle timing "time to interactive",
          # and called diagnostic-channel assertions "simulator state assertions".
          $Lines += "Evidence: the windows-verification artifact on [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) holds a sanitized summary and bounded failure excerpts only. Screenshots, raw logs and databases stay on the runner."
          $EvidencePath = Join-Path $env:GITHUB_WORKSPACE "verification/evidence/windows-verification-summary.json"
          if (Test-Path -LiteralPath $EvidencePath) {
            $Evidence = Get-Content -LiteralPath $EvidencePath -Raw | ConvertFrom-Json
            if ($null -ne $Evidence.launch) {
              # The release time is only observed when the handle goes before the process does; a
              # process that exits first leaves it null, and that is said rather than printed blank.
              $Released = if ($null -ne $Evidence.launch.windowReleasedAfterCloseSeconds) { "window released $($Evidence.launch.windowReleasedAfterCloseSeconds)s after the close request" } else { "process exited before a separate window release was observed" }
              $Lines += "Launch probe: main window handle after $($Evidence.launch.mainWindowAfterSeconds)s; $Released; exit code $($Evidence.launch.exitCode). Window presence and process health, not semantic interactivity."
            }
            if ($null -ne $Evidence.gallery) {
              $Clean = $Evidence.gallery.launchCount - $Evidence.gallery.failedCount
              $Lines += "Page gallery: $Clean of $($Evidence.gallery.launchCount) launches responsive, visually varied, and gracefully shut down; $($Evidence.gallery.interactionPassedLaunchCount) of $($Evidence.gallery.interactionRequiredLaunchCount) required packaged-shell UI Automation interactions passed, with armed warning capture and no interface faults. Full usability and data/tile readiness are not proven (open #279 criterion; readiness signal owned by #281)."
            }
            if ($null -ne $Evidence.smoke) {
              $Persistence = $Evidence.smoke.persistence
              $Lines += "Developer diagnostic smoke: $($Evidence.smoke.passedAssertionCount) of $($Evidence.smoke.assertionCount) recorded assertions passed (it stops at the first failure); durable scan rows $($Persistence.scanEventCountBefore) to $($Persistence.scanEventCountAfter), expected +$($Persistence.expectedScanEventDelta). Demo fixture scans sent through the authenticated diagnostic channel; the packaged app does not yet ingest simulator files."
            }
          }
          else {
            $Lines += "No sanitized evidence summary was produced."
          }
          ($Lines -join [Environment]::NewLine) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $Failed = @($Steps.Keys | Where-Object { $Steps[$_] -ne "success" })
          if ($Failed.Count -gt 0) {
            Write-Host ("Windows verification failed: " + ($Failed -join ", "))
            exit 1
          }

          Write-Host "Every Windows verification step passed."
      - name: Publish the verified package
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TarkovCompanion-win-x64
          path: |
            ${{ env.TARKOV_PACKAGE_ZIP }}
            dist/SHA256SUMS.txt
          if-no-files-found: warn

      # Unsigned, and said to be: this is the installer and feed for the rough test builds, not
      # a release. Not uploaded for pull requests, so the only builds an operator can publish to
      # the relay are ones that were merged. A week is enough to cut a rough build from it.
      - name: Publish the rough update channel
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rough-channel
          path: dist/rough-channel/*
          if-no-files-found: error
          retention-days: 7

      # Everything the publish job needs, handed over rather than published from here. This
      # job runs for pull requests, so it must not be the one holding the write token.
      #
      # error rather than warn: a payload missing a file is a publish that would upload a
      # partial feed, and this is the last point at which that is a build failure instead of
      # a release.
      - name: Hand the release payload to the publish job
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-payload
          path: |
            dist/velopack/*
            dist/VELOPACK-SHA256SUMS.txt
            dist/SHA256SUMS.txt
            dist/update.json
            dist/COMPONENT-SHA256SUMS.txt
            dist/TarkovCompanion-data-*.json
            dist/TarkovCompanion-model-eng-*.traineddata
            ${{ env.TARKOV_PACKAGE_ZIP }}
          if-no-files-found: error
