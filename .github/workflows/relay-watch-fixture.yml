name: Relay watch fixtures

on:
  pull_request:
    paths:
      - '.github/workflows/relay-watch.yml'
      - '.github/workflows/relay-watch-fixture.yml'
      - 'deploy/group-server/monitoring/**'

permissions:
  contents: read

concurrency:
  group: relay-watch-fixture-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Prove relay, report, and issue controls
        run: bash deploy/group-server/monitoring/test-relay-watch.sh
