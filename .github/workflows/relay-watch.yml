# Is the relay up, and is it running what main says it should be?
#
# Nothing watched it. A relay that stopped answering, or that quietly stayed three days behind
# because an update failed and kept failing, was noticed when somebody's group panel went
# strange mid-raid — which is the worst moment and the least informative one.
name: Relay watch

on:
  schedule:
    # Hourly. The relay checks for its own updates every thirty minutes, so an hour is long
    # enough that a normal update window is never mistaken for a fault.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: relay-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the relay what it is
        id: health
        env:
          RELAY: ${{ vars.RELAY_HEALTH_URL }}
        run: |
          set -uo pipefail
          if [ -z "${RELAY:-}" ]; then
            # Said where somebody will see it rather than on stderr of a green run. This
            # workflow has reported success hourly since it was written while watching nothing
            # at all, and the desktop "Report a problem" button files through it — so player
            # reports have been landing on the relay and becoming issues never.
            #
            # Still not a failure. An unset variable is a thing nobody has done yet, not a
            # thing that broke, and a red cross every hour would be noise somebody learns to
            # ignore. A warning annotation and a line in the summary is the loudest thing that
            # is still true.
            echo "::warning title=Relay watch is not configured::Set the RELAY_HEALTH_URL repository variable to the relay's /health address. Until then this workflow checks nothing and files no reports."
            {
              echo '### Relay watch is not configured'
              echo
              echo 'No `RELAY_HEALTH_URL` repository variable is set, so this run checked nothing.'
              echo
              echo 'While it is unset the relay is unwatched **and** problem reports sent by the'
              echo 'desktop "Report a problem" button are never turned into issues — they stay on'
              echo 'the relay until somebody reads them by hand.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          body="$(curl -fsS --max-time 20 "$RELAY" 2>/dev/null || true)"
          if [ -z "$body" ]; then
            echo "reason=The relay did not answer $RELAY within 20 seconds." >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$body"
          commit="$(printf '%s' "$body" | jq -r '.commit // empty')"
          version="$(printf '%s' "$body" | jq -r '.version // "unknown"')"
          if [ -z "$commit" ]; then
            echo "reason=The relay answered but named no commit, so it is a build from before /health reported one." >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Behind is normal for up to an hour; the relay polls every thirty minutes. Days
          # behind means an update is failing and being refused, over and over.
          if ! git -C . cat-file -e "$commit" 2>/dev/null; then
            echo "The relay names a commit this checkout does not have; treating as up to date." >&2
            exit 0
          fi

          age="$(git log -1 --format=%ct "$commit")"
          now="$(date +%s)"
          hours=$(( (now - age) / 3600 ))
          echo "Relay is on $version ($commit), built ${hours}h ago."
          if [ "$hours" -gt 24 ]; then
            echo "reason=The relay is running a build from ${hours}h ago ($version, $commit). Its updater runs every thirty minutes, so it is refusing something." >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Turn any new problem reports into issues
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY: ${{ vars.RELAY_HEALTH_URL }}
          ADMIN_KEY: ${{ secrets.TARKOV_RELAY_ADMIN_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${RELAY:-}" ] || [ -z "${ADMIN_KEY:-}" ]; then
            echo "No relay URL or admin key configured; not looking for reports." >&2
            exit 0
          fi

          # The relay holds the bodies and this names them. The repository is public, so an
          # issue that carried a player's machine details would publish them; an issue that
          # names a reference publishes nothing and is just as findable.
          base="${RELAY%/health}"
          list="$(curl -fsS --max-time 20 -H "X-Admin-Key: $ADMIN_KEY" "$base/reports" || echo '[]')"
          echo "$list" | jq -r '.[] | "\(.reference) \(.bytes) \(.receivedUtc)"' | while read -r ref bytes received; do
            [ -z "$ref" ] && continue
            title="Problem report $ref"
            if gh issue list --repo "${{ github.repository }}" --state all \
                 --search "in:title \"$title\"" --json number --jq '.[0].number // empty' | grep -q .; then
              continue
            fi

            printf '%s\n' \
              "A player sent a diagnostic report from the companion's Report a problem button." \
              "" \
              "- reference: \`$ref\`" \
              "- size: $bytes bytes" \
              "- received: $received" \
              "" \
              "The report itself is on the relay, not here: this repository is public and the report describes somebody's machine. Read it with the relay admin key:" \
              "" \
              "\`\`\`" \
              "curl -H \"X-Admin-Key: \$TARKOV_RELAY_ADMIN_KEY\" $base/reports/$ref" \
              "\`\`\`" \
              "" \
              "It excludes game logs, the group key and screenshot pixels, but can contain folder paths and screenshot coordinates. Do not paste it into this issue; see docs/OPERATIONS.md." \
              > /tmp/report.md
            gh issue create --repo "${{ github.repository }}" --title "$title" --body-file /tmp/report.md --label problem-report
            echo "opened an issue for $ref"
          done

      - name: Open one issue, and only one
        if: steps.health.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.health.outputs.reason }}
        run: |
          set -euo pipefail
          title="Relay watch: the group relay needs looking at"
          existing="$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"

          # Commented on rather than duplicated. An hourly check that opens an issue an hour
          # would bury the one useful report under twenty-three copies of itself.
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$REASON"
            exit 0
          fi

          printf '%s\n\n%s\n' \
            "$REASON" \
            "Checked hourly by relay-watch.yml. docs/OPERATIONS.md says what the relay is and where it keeps things. This issue is commented on rather than duplicated while it stays open." \
            > /tmp/body.md
          gh issue create --repo "${{ github.repository }}" --title "$title" --body-file /tmp/body.md
