# Is the relay up, and is it running what main says it should be?
#
# Nothing watched it. A relay that stopped answering, or that quietly stayed three days behind
# because an update failed and kept failing, was noticed when somebody's group panel went
# strange mid-raid — which is the worst moment and the least informative one.
name: Relay watch

on:
  schedule:
    # Hourly. The relay checks for its own updates every thirty minutes, so an hour is long
    # enough that a normal update window is never mistaken for a fault.
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/relay-watch.yml'
      - 'deploy/group-server/monitoring/**'

permissions:
  contents: read

concurrency:
  group: relay-watch
  cancel-in-progress: false

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The stale-deployment fixture belongs beside the classifier, rather than relying on a
      # one-off manual workflow run that happens to find an old relay. This checkout also means
      # every alert has the exact monitoring rule that produced it as evidence.
      - uses: actions/checkout@v5
      - name: Prove a stale deployment alerts
        run: bash deploy/group-server/monitoring/test-relay-watch.sh

  watch:
    if: github.event_name != 'pull_request'
    needs: fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Health carries a commit. A shallow checkout cannot tell whether that commit is a real
      # deployment from this repository, so it used to treat an unknown value as up to date.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ask the relay what it is
        id: health
        env:
          RELAY: ${{ vars.RELAY_HEALTH_URL }}
        run: |
          set -uo pipefail
          if [ -z "${RELAY:-}" ]; then
            # Said where somebody will see it rather than on stderr of a green run. This
            # workflow has reported success hourly since it was written while watching nothing
            # at all, and the desktop "Report a problem" button files through it — so player
            # reports have been landing on the relay and becoming issues never.
            #
            # Still not a failure. An unset variable is a thing nobody has done yet, not a
            # thing that broke, and a red cross every hour would be noise somebody learns to
            # ignore. A warning annotation and a line in the summary is the loudest thing that
            # is still true.
            echo "::warning title=Relay watch is not configured::Set the RELAY_HEALTH_URL repository variable to the relay's /health address. Until then this workflow checks nothing and files no reports."
            {
              echo '### Relay watch is not configured'
              echo
              echo "No \`RELAY_HEALTH_URL\` repository variable is set, so this run checked nothing."
              echo
              echo 'While it is unset the relay is unwatched **and** problem reports sent by the'
              echo 'desktop "Report a problem" button are never turned into issues — they stay on'
              echo 'the relay until somebody reads them by hand.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          health_file="$(mktemp)"
          trap 'rm -f -- "$health_file"' EXIT
          if ! curl -fsS --max-time 20 "$RELAY" >"$health_file" 2>/dev/null; then
            # Do not include the relay URL in durable Actions output. It can be an operator's
            # private hostname, while this fixed sentence still tells the on-call person what
            # to inspect.
            echo "reason=The relay did not answer its health request within 20 seconds." >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit="$(jq -r '.commit // empty' "$health_file")"
          if ! [[ "$commit" =~ ^[0-9a-fA-F]{7,64}$ ]] || ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
            echo "reason=The relay health response did not name a known deployment commit." >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The helper reads only the constrained health shape and writes an enumerated status
          # and sentence. It intentionally does not copy the body, route, room counts, or other
          # unexpected fields to Actions logs.
          if ! bash deploy/group-server/monitoring/relay-watch.sh \
              --health-file "$health_file" \
              --expected-commit "$(git rev-parse HEAD)" \
              --expected-commit-utc "$(git log -1 --format=%ct HEAD)" \
              --github-output "$GITHUB_OUTPUT"; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Turn any new problem reports into issues
        if: steps.health.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY: ${{ vars.RELAY_HEALTH_URL }}
          ADMIN_KEY: ${{ secrets.TARKOV_RELAY_ADMIN_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${RELAY:-}" ] || [ -z "${ADMIN_KEY:-}" ]; then
            echo "No relay URL or admin key configured; not looking for reports." >&2
            exit 0
          fi

          # The relay holds the bodies and this names them. The repository is public, so an
          # issue that carried a player's machine details would publish them; an issue that
          # names a reference publishes nothing and is just as findable.
          base="${RELAY%/health}"
          list="$(curl -fsS --max-time 20 -H "X-Admin-Key: $ADMIN_KEY" "$base/reports" 2>/dev/null || echo '[]')"
          echo "$list" | jq -r '.[] | "\(.reference) \(.bytes) \(.receivedUtc)"' | while read -r ref bytes received; do
            [ -z "$ref" ] && continue
            title="Problem report $ref"
            printf '%s\n' \
              "A player sent a diagnostic report from the companion's Report a problem button." \
              "" \
              "- reference: \`$ref\`" \
              "- size: $bytes bytes" \
              "- received: $received" \
              "" \
              "The report body and relay address are not attached to this public issue. An authorised operator can retrieve the report through the restricted relay endpoint." \
              > /tmp/report.md
            bash deploy/group-server/monitoring/open-relay-issue.sh \
              --repository "${{ github.repository }}" --title "$title" --body-file /tmp/report.md --on-existing skip
            echo "recorded the report reference"
          done

      - name: Open one issue, and only one
        if: steps.health.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.health.outputs.reason }}
        run: |
          set -euo pipefail
          title="Relay watch: the group relay needs looking at"

          # Commented on rather than duplicated. An hourly check that opens an issue an hour
          # would bury the one useful report under twenty-three copies of itself.
          printf '%s\n\n%s\n' \
            "$REASON" \
            "Checked hourly by relay-watch.yml. docs/OPERATIONS.md says what the relay is and where it keeps things. This issue is commented on rather than duplicated while it stays open." \
            > /tmp/body.md
          bash deploy/group-server/monitoring/open-relay-issue.sh \
            --repository "${{ github.repository }}" --title "$title" --body-file /tmp/body.md
