# Is the relay up, and is it running the build that the verified dev feed publishes?
name: Relay watch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/relay-watch.yml'
      - 'deploy/group-server/monitoring/**'

permissions:
  contents: read

# A pull-request fixture cannot queue behind or interfere with the one live watch. Each PR has
# its own replaceable lane; scheduled and manual default-branch watches serialize in one lane.
concurrency:
  group: relay-watch-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prove publication, relay, report, and issue controls
        run: bash deploy/group-server/monitoring/test-relay-watch.sh

  watch:
    # Scheduled workflows already use the default branch. This also prevents a manual dispatch
    # from a feature branch from filing live incidents with feature-branch code.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the published build and ask the relay what it is
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY: ${{ vars.RELAY_HEALTH_URL }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail

          fail_watch() {
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "${RELAY:-}" ]; then
            echo "::warning title=Relay watch is not configured::Set the RELAY_HEALTH_URL repository variable to the relay's /health address. Until then this workflow checks nothing and files no reports."
            {
              echo '### Relay watch is not configured'
              echo
              echo 'No RELAY_HEALTH_URL repository variable is set, so this run checked nothing.'
              echo
              echo 'While it is unset the relay is unwatched and problem reports remain on the'
              echo 'relay until an operator inspects its protected state.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          task_temp="$(mktemp -d "${RUNNER_TEMP}/relay-watch.XXXXXX")"
          trap 'rm -rf -- "$task_temp"' EXIT
          health_file="${task_temp}/health.json"
          release_raw="${task_temp}/release-raw.json"
          release_evidence="${task_temp}/release-evidence.json"
          update_file="${task_temp}/update.json"
          run_raw="${task_temp}/run-raw.json"
          run_evidence="${task_temp}/run-evidence.json"

          if ! curl -fsS --max-time 20 --max-filesize 16384 -- "$RELAY" > "$health_file" 2>/dev/null; then
            fail_watch "The relay did not answer its bounded health request within 20 seconds."
          fi

          if ! gh api "repos/${REPOSITORY}/releases/tags/dev" > "$release_raw" 2>/dev/null; then
            fail_watch "The dev publication metadata could not be read."
          fi
          if [ "$(stat -c '%s' "$release_raw")" -gt 262144 ]; then
            fail_watch "The dev publication metadata exceeded its validation limit."
          fi

          expected_manifest_url="https://github.com/${REPOSITORY}/releases/download/dev/update.json"
          if ! jq -e --arg url "$expected_manifest_url" '
              type == "object" and
              .tag_name == "dev" and
              .draft == false and
              .prerelease == true and
              (.assets | type == "array" and length <= 100) and
              ([.assets[]? | select(.name == "update.json")] | length) == 1 and
              ([.assets[]? | select(.name == "update.json")][0] |
                .state == "uploaded" and
                (.size | type == "number" and . == floor and . > 0 and . <= 4096) and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                (.updated_at | type == "string") and
                .browser_download_url == $url)
            ' "$release_raw" >/dev/null 2>&1; then
            fail_watch "The dev publication did not expose one bounded update manifest."
          fi

          jq '([.assets[] | select(.name == "update.json")][0]) as $asset |
              {
                tagName: "dev",
                assetName: $asset.name,
                size: $asset.size,
                digest: $asset.digest,
                publishedUtc: $asset.updated_at
              }' "$release_raw" > "$release_evidence"
          manifest_url="$(jq -r '[.assets[] | select(.name == "update.json")][0].browser_download_url' "$release_raw")"
          if ! curl -fsSL --max-time 20 --max-filesize 4096 -- "$manifest_url" > "$update_file" 2>/dev/null; then
            fail_watch "The bounded dev update manifest could not be downloaded."
          fi

          recorded_size="$(jq -r '.size' "$release_evidence")"
          recorded_digest="$(jq -r '.digest | sub("^sha256:"; "")' "$release_evidence")"
          if [ "$(stat -c '%s' "$update_file")" != "$recorded_size" ] ||
             [ "$(sha256sum "$update_file" | awk '{print $1}')" != "$recorded_digest" ]; then
            fail_watch "The dev update manifest did not match GitHub's published asset digest."
          fi

          if ! run_id="$(jq -er '
              if type == "object" and
                 (.run | type == "string" and test("^[1-9][0-9]{0,15}$") and
                   ((tonumber? // 0) <= 9007199254740991))
              then .run else error("invalid run") end
            ' "$update_file" 2>/dev/null)"; then
            fail_watch "The dev update manifest did not name a bounded verification run."
          fi
          if ! gh api "repos/${REPOSITORY}/actions/runs/${run_id}" > "$run_raw" 2>/dev/null; then
            fail_watch "The verification run named by the dev update manifest could not be read."
          fi
          if [ "$(stat -c '%s' "$run_raw")" -gt 65536 ]; then
            fail_watch "The verification run evidence exceeded its validation limit."
          fi
          jq '{
                id,
                headSha: .head_sha,
                headBranch: .head_branch,
                event,
                status,
                conclusion,
                workflowPath: .path,
                runStartedUtc: .run_started_at,
                runCompletedUtc: .updated_at
              }' "$run_raw" > "$run_evidence"

          if ! bash deploy/group-server/monitoring/relay-watch.sh \
              --health-file "$health_file" \
              --update-file "$update_file" \
              --release-evidence-file "$release_evidence" \
              --run-evidence-file "$run_evidence" \
              --repository-root "$GITHUB_WORKSPACE" \
              --default-branch "$DEFAULT_BRANCH" \
              --default-branch-commit "$(git rev-parse HEAD)" \
              --github-output "$GITHUB_OUTPUT"; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate report references before filing issues
        if: steps.health.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY: ${{ vars.RELAY_HEALTH_URL }}
          ADMIN_KEY: ${{ secrets.TARKOV_RELAY_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELAY:-}" ] || [ -z "${ADMIN_KEY:-}" ]; then
            echo "::warning title=Problem report pickup is not configured::The relay URL or admin key is absent, so this run did not list reports."
            exit 0
          fi

          report_list="$(mktemp "${RUNNER_TEMP}/relay-reports.XXXXXX.json")"
          trap 'rm -f -- "$report_list"' EXIT
          base="${RELAY%/health}"
          if ! curl -fsS --max-time 20 --max-filesize 65536 \
              -H "X-Admin-Key: $ADMIN_KEY" -- "$base/reports" > "$report_list" 2>/dev/null; then
            echo "::error title=Problem report pickup failed::The bounded report listing could not be downloaded; no report issue was written."
            exit 1
          fi
          if ! bash deploy/group-server/monitoring/file-relay-reports.sh \
              --list-file "$report_list" --repository "${GITHUB_REPOSITORY}"; then
            echo "::error title=Problem report pickup refused input::The complete listing failed validation; no report issue was written."
            exit 1
          fi

      - name: Open one health incident, and only one
        if: always() && steps.health.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.health.outputs.reason }}
        run: |
          set -euo pipefail
          title="Relay watch: the group relay needs looking at"
          body_file="$(mktemp "${RUNNER_TEMP}/relay-incident.XXXXXX.md")"
          trap 'rm -f -- "$body_file"' EXIT
          printf '%s\n\n%s\n' \
            "$REASON" \
            "Checked hourly by relay-watch.yml. docs/OPERATIONS.md describes the operator evidence. This issue is commented on rather than duplicated while it stays open." \
            > "$body_file"
          bash deploy/group-server/monitoring/open-relay-issue.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --title "$title" \
            --body-file "$body_file" \
            --existing-state open
