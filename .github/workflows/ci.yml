name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore TarkovCompanion.sln --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false
      - name: Build
        run: dotnet build TarkovCompanion.sln --configuration Release --no-restore --maxcpucount:1
      - name: Test
        run: dotnet test TarkovCompanion.sln --configuration Release --no-build --no-restore --maxcpucount:1 --logger "trx;LogFileName=tests.trx"
      - name: Dependency vulnerability audit
        run: dotnet list TarkovCompanion.sln package --vulnerable --include-transitive --no-restore
      - name: Dependency license audit
        run: ./scripts/audit-licenses.sh
      - name: License audit fail-closed fixture
        run: ./scripts/test-license-audit.sh
      - name: Safety audit
        run: ./scripts/audit-safety.sh
      - name: Secret-pattern audit
        run: ./scripts/scan-secrets.sh
      # Reports, never fails. Three "written and never read" bugs turned up in one night and
      # each cost an hour; this is the two greps that would have found them, run where nobody
      # has to remember to run them.
      - name: Written-and-never-read sweep
        run: |
          ./scripts/sweep-unread.sh | tee /tmp/sweep.txt
          {
            echo '### Written and never read'
            echo '```'
            cat /tmp/sweep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: linux-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  # Builds, tests and packages on Windows, and deliberately publishes nothing.
  #
  # This job used to upload the package under the same artifact name as the Windows
  # verification workflow, so two different binaries for the same commit existed under one
  # name and which one got installed depended on somebody reading the workflow name off the
  # run. Only the verification workflow launches the package it builds and screenshots it
  # running, so that is the only one whose output may be installed. Packaging still happens
  # here, because a packaging failure is worth catching on a pull request; the result is
  # thrown away on purpose.
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore TarkovCompanion.sln --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false
      - name: Build and test
        run: |
          dotnet build TarkovCompanion.sln --configuration Release --no-restore --maxcpucount:1
          dotnet test TarkovCompanion.sln --configuration Release --no-build --no-restore --maxcpucount:1
      - name: Restore win-x64 publish graphs
        run: |
          dotnet restore src/TarkovCompanion.App/TarkovCompanion.App.csproj --runtime win-x64 --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false
          dotnet restore src/TarkovCompanion.EftSimulator/TarkovCompanion.EftSimulator.csproj --runtime win-x64 --disable-parallel -p:RestoreDisableParallel=true -p:BuildInParallel=false
      - name: Audit and package self-contained win-x64, then discard it
        shell: bash
        run: ./scripts/package-windows.sh
