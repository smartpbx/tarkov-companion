<!doctype html>
<html><head><meta charset="utf-8"><title>V3 · Screenshot to answer</title>
<link rel="stylesheet" href="v3.css"><script src="v3.js"></script>
<style>
.main { grid-template-columns: 1fr 420px; }
.work { display: grid; grid-template-rows: auto auto 1fr; gap: 16px; min-height: 0; }
.tabs { display: flex; gap: 4px; align-items: center; }
.tabs span { height: 36px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: var(--r-ctl); color: var(--text2); font-weight: 500; }
.tabs span.on { color: var(--text); background: var(--raised); box-shadow: inset 0 -2px 0 var(--action); }
.hero { padding: 20px 24px; display: flex; align-items: center; gap: 20px; }
.avatar { width: 64px; height: 64px; border-radius: 12px; background: linear-gradient(160deg, #2b4658, #1a2b37); border: 1px solid rgba(130,151,164,.35); display: grid; place-items: center; color: var(--text2); }
.stat { padding: 0 20px; border-left: 1px solid var(--divider); }
.stat .v { font-size: 20px; font-weight: 600; line-height: 26px; }
.split { display: grid; grid-template-columns: 1fr 400px; gap: 16px; min-height: 0; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); padding: 10px 12px; border-bottom: 1px solid var(--divider); }
td { padding: 14px 12px; border-bottom: 1px solid var(--divider); vertical-align: middle; font-size: 15px; }
tr.sel td { background: rgba(99,212,221,.07); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--action); }
td.num, th.num { text-align: right; white-space: nowrap; }
.good { color: var(--success); font-weight: 600; }
.ico { width: 44px; height: 44px; border-radius: 6px; background: #0f1b24; border: 1px solid rgba(130,151,164,.3); display: grid; place-items: center; }
.kv { display: grid; grid-template-columns: 1fr auto; row-gap: 10px; column-gap: 12px; font-size: 15px; }
.kv .k { color: var(--text2); }
.tray { display: flex; flex-direction: column; min-height: 0; }
.tray .hd { padding: 18px 20px 12px; display: flex; align-items: center; }
.ans { margin: 0 12px 12px; padding: 14px 16px; border-radius: var(--r-card); background: var(--raised); border: 1px solid rgba(130,151,164,.16); }
.ans.new { border-color: rgba(99,212,221,.6); box-shadow: 0 0 0 1px rgba(99,212,221,.25); }
.ans .top { display: flex; align-items: center; gap: 10px; }
.ans .kind { font-weight: 700; font-size: 15px; }
.ans .age { margin-left: auto; color: var(--text2); font-size: 13px; }
.thumb { width: 36px; height: 36px; border-radius: 6px; background: #0f1b24; border: 1px solid rgba(130,151,164,.3); display: grid; place-items: center; color: var(--text2); flex: none; }
.banner { margin-top: 12px; padding: 12px; border-radius: 8px; background: rgba(134,191,255,.10); border: 1px solid rgba(134,191,255,.45); }
.cchip { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--unknown); color: var(--unknown); font-weight: 600; font-size: 13px; }
.because { align-self: start; justify-self: start; }
</style></head>
<body><div class="app" id="app">
<main class="main">
  <section class="work">
    <div class="row" style="justify-content:space-between">
      <div class="tabs"><span>Search</span><span>Items</span><span class="on">Traders</span><span>Quests</span><span>Hideout</span><span>Flea</span></div>
      <div id="because"></div>
    </div>
    <div class="card hero" id="hero"></div>
    <div class="split">
      <div class="card" id="buys"></div>
      <div class="card pad" id="detail"></div>
    </div>
  </section>
  <aside class="card tray" id="tray"></aside>
</main></div>
<script>
mount('app', chrome({ state: 'In stash', nav: 'intel',
  chip: `<span class="chip" style="color:var(--success);background:rgba(113,209,154,.10)">${icon('camera','s14')} screenshot understood 2 s ago</span>` }));
document.getElementById('because').innerHTML = `<span class="because">${icon('info','s16','color:var(--action)')}<span>Opened Trader: your screenshot showed Mechanic</span><span class="undo">Stay</span><span class="undo" style="margin-left:0">Undo</span></span>`;
document.getElementById('hero').innerHTML = `
  <span class="avatar">${icon('trader','s24')}</span>
  <div style="flex:1"><div class="h1">Mechanic · LL2 <span class="sec" style="font-size:16px;font-weight:500">(read from screen)</span></div>
  <div class="sec" style="margin-top:2px">Trader screen understood 2 s ago · prices checked against the flea at a 5% fee</div></div>
  <div class="stat"><div class="label">Buys for your plan</div><div class="v">3</div></div>
  <div class="stat"><div class="label">Restock</div><div class="v">1 h 12 m</div></div>
  <div class="stat"><div class="label">You save</div><div class="v ok">₽22.2k</div></div>`;

const svgI = {
  toolset: '<svg width="30" height="30" viewBox="0 0 30 30"><rect x="4" y="9" width="22" height="15" rx="2" fill="#2a3d4a" stroke="#86BFFF" stroke-width="1.5"/><path d="M11 9V6h8v3" stroke="#C8D5DC" stroke-width="1.5" fill="none"/><path d="M4 15h22" stroke="#86BFFF" stroke-width="1.2"/></svg>',
  guard: '<svg width="30" height="30" viewBox="0 0 30 30"><rect x="3" y="11" width="24" height="8" rx="2" fill="#2b3530" stroke="#71D19A" stroke-width="1.5"/><path d="M6 11v-2M10 11v-2M14 11v-2M18 11v-2M22 11v-2" stroke="#9FB3BF" stroke-width="1.4"/></svg>',
  clock: '<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="10" fill="#22303a" stroke="#C8D5DC" stroke-width="1.5"/><path d="M15 9v6l4 2" stroke="#C8D5DC" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>'
};
document.getElementById('buys').innerHTML = `
  <div style="padding:16px 16px 6px" class="row"><span class="caps">Buy here for your plan</span><span class="label" style="margin-left:auto">flea at a 5% fee · last seen 3 min ago</span></div>
  <table>
    <tr><th style="width:60px"></th><th>Item</th><th class="num">Here</th><th class="num">Flea</th><th class="num">Saves</th></tr>
    <tr class="sel"><td><span class="ico">${svgI.toolset}</span></td><td><div style="font-weight:600">Toolset</div><div class="label">barter 2× Bolts + 1× Screw nut · cheaper than flea</div></td><td class="num">barter ≈ ₽19.6k</td><td class="num">₽38k</td><td class="num good">₽18.4k</td></tr>
    <tr><td><span class="ico">${svgI.guard}</span></td><td><div style="font-weight:600">AK-74 railed handguard</div><div class="label">weapon part for Gunsmith Part 5</div></td><td class="num">₽14.2k</td><td class="num">₽18k</td><td class="num good">₽3.8k</td></tr>
    <tr><td><span class="ico">${svgI.clock}</span></td><td><div style="font-weight:600">Restock in 1 h 12 m</div><div class="label">read from screen · reminder at restock</div></td><td class="num sec">–</td><td class="num sec">–</td><td class="num"><span class="btn" style="height:28px;font-size:13px">Remind me</span></td></tr>
  </table>
  <div class="label" style="padding:12px 16px 4px">Barter value uses the flea price of each part. Prices are last-seen, not live.</div>
  <div style="padding:22px 16px 6px" class="row"><span class="caps">Mechanic tasks on your plan</span><span class="label" style="margin-left:auto">from your last TASKS screenshot, 18:12</span></div>
  <table>
    <tr><td style="width:60px"><span class="ico">${icon('tasks','s16')}</span></td><td><div style="font-weight:600">Gunsmith - Part 5</div><div class="label">active · needs the AK-74 railed handguard above</div></td><td class="num"><span class="chip" style="color:var(--success);background:rgba(113,209,154,.10)">buy here</span></td></tr>
    <tr><td><span class="ico">${icon('tasks','s16')}</span></td><td><div style="font-weight:600">Farming - Part 1</div><div class="label">active · Customs, fits tonight's map</div></td><td class="num"><span class="chip">in the Customs brief</span></td></tr>
    <tr><td><span class="ico">${icon('tasks','s16')}</span></td><td><div style="font-weight:600">Signal - Part 1</div><div class="label">locked · needs Mechanic LL2 and level 12</div></td><td class="num"><span class="chip" style="color:var(--info);background:rgba(134,191,255,.10)">unlocks soon</span></td></tr>
  </table>`;
document.getElementById('detail').innerHTML = `
  <div class="row" style="gap:14px"><span class="ico" style="width:64px;height:64px">${svgI.toolset.replace('width="30" height="30"','width="44" height="44"')}</span>
  <div><div class="h2">Toolset</div><div class="label">Tools · 2×2 · 2 on your plan</div></div></div>
  <div style="height:1px;background:var(--divider);margin:16px 0"></div>
  <div class="caps" style="margin-bottom:10px">At Mechanic LL2</div>
  <div class="kv">
    <span class="k">Barter</span><span>2× Bolts + 1× Screw nut</span>
    <span class="k">You have</span><span>Bolts 3 · Screw nut 1 <span class="ok">✔</span></span>
    <span class="k">Barter value</span><span>≈ ₽19.6k</span>
    <span class="k">Flea, 5% fee</span><span>₽38k <span class="label">3 min ago</span></span>
  </div>
  <div style="height:1px;background:var(--divider);margin:16px 0"></div>
  <div class="caps" style="margin-bottom:10px">Why it is on your plan</div>
  <div class="kv">
    <span class="k">Hideout</span><span>Workbench L2 ×1</span>
    <span class="k">Quest</span><span>Gunsmith line ×1</span>
  </div>
  <div style="height:1px;background:var(--divider);margin:16px 0"></div>
  <div class="row" style="margin-bottom:8px"><span class="caps">Flea, last seen prices</span><span class="label" style="margin-left:auto">7 days</span></div>
  <svg width="100%" height="96" viewBox="0 0 360 96" preserveAspectRatio="none">
    <defs><linearGradient id="sp" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#63D4DD" stop-opacity=".35"/><stop offset="1" stop-color="#63D4DD" stop-opacity="0"/></linearGradient></defs>
    <path d="M0 58 L30 52 L60 60 L90 46 L120 50 L150 40 L180 44 L210 34 L240 42 L270 30 L300 36 L330 28 L360 32 L360 96 L0 96Z" fill="url(#sp)"/>
    <path d="M0 58 L30 52 L60 60 L90 46 L120 50 L150 40 L180 44 L210 34 L240 42 L270 30 L300 36 L330 28 L360 32" fill="none" stroke="#63D4DD" stroke-width="2"/>
    <line x1="0" x2="360" y1="74" y2="74" stroke="#71D19A" stroke-dasharray="4 4" stroke-width="1.5"/>
  </svg>
  <div class="row label" style="margin-top:4px"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:14px;height:2px;background:#63D4DD"></span>flea ₽33k → ₽38k</span><span style="display:inline-flex;align-items:center;gap:6px;margin-left:16px"><span style="width:14px;border-top:2px dashed #71D19A"></span>barter here ≈ ₽19.6k</span></div>
  <div class="row" style="margin-top:20px;gap:10px"><span class="btn primary">Add to shopping list</span><span class="btn">Open item</span></div>`;

document.getElementById('tray').innerHTML = `
  <div class="hd"><span class="h3">Intake</span><span class="label" style="margin-left:10px">last three answers</span><span class="label" style="margin-left:auto">nothing armed</span></div>
  <div class="ans new"><div class="top"><span class="thumb">${icon('trader','s16')}</span><span class="kind">Trader · Mechanic</span><span class="age">2 s</span></div>
    <div style="margin-top:8px;font-size:15px">3 buys for your plan</div></div>
  <div class="ans"><div class="top"><span class="thumb">${icon('tasks','s16')}</span><span class="kind">TASKS · Prapor</span><span class="age">21 s</span></div>
    <div class="banner"><div style="font-weight:600;font-size:15px">Sync 4 changes?</div>
      <div class="sec" style="margin-top:2px">Checking 0/1 → active · +3 more</div>
      <div class="row" style="margin-top:10px;gap:8px"><span class="btn primary" style="height:32px">Confirm</span><span class="btn">Review</span></div>
      <div class="label" style="margin-top:8px">Nothing changes until you confirm.</div></div></div>
  <div class="ans"><div class="top"><span class="thumb">${icon('grid','s16')}</span><span class="kind">Stash page 2</span><span class="age">38 s</span></div>
    <div style="margin-top:8px;font-size:15px">Sell 6 · ₽412k net at 5% fee</div>
    <div class="sec" style="font-size:14px">Keep for quests 4 · Keep for hideout 3</div>
    <div class="label" style="margin-top:6px">${icon('check','s14','vertical-align:-2px;color:var(--success)')} Merged into stash snapshot 18:41</div></div>
  <div class="ans" style="border-color:rgba(192,181,247,.45)"><div class="top"><span class="thumb" style="color:var(--unknown)">${icon('question','s16')}</span><span class="kind unk">Unrecognised</span><span class="age">1 m</span></div>
    <div style="margin-top:8px;font-size:15px">Tell me what this was:</div>
    <div class="row" style="margin-top:10px;gap:8px"><span class="cchip">Hideout</span><span class="cchip">Flea</span><span class="cchip">Other</span></div></div>
  <div class="more" style="margin-top:auto"><span>All screenshots this session</span>${icon('chevr','s16')}</div>`;
</script></body></html>
